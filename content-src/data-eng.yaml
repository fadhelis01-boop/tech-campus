id: data-eng
version: 2026.10.1
title: Data engineering
branch: Data
icon: 🛢️
color: "#0d9488"
order: 20
updatedAt: 2026-10-05
description: Le cœur du métier — formats, pandas, pipelines ETL/ELT, entrepôts et lakehouse, modélisation en étoile, dbt, Airflow, qualité, Spark, streaming, plateformes, gouvernance et projet de bout en bout.
outlook: L'IA et l'analyse reposent sur des données fiables ; le data engineer, qui les rend disponibles, est l'un des profils les plus recherchés du secteur et le restera tant que les volumes croîtront.
glossary:
  - { term: Pipeline de données, en: data pipeline, def: "Chaîne automatisée qui collecte, transforme et charge des données." }
  - { term: ETL, en: Extract Transform Load, def: "Extraire, transformer, puis charger." }
  - { term: ELT, en: Extract Load Transform, def: "Charger les données brutes, puis les transformer dans l'entrepôt (approche dominante dans le cloud)." }
  - { term: Batch, en: batch processing, def: "Traitement par lots à intervalles réguliers." }
  - { term: Streaming, en: stream processing, def: "Traitement continu des événements à leur arrivée." }
  - { term: Parquet, en: Apache Parquet, def: "Format de fichier en colonnes, compressé et typé, standard de l'analytique." }
  - { term: Partitionnement, en: partitioning, def: "Rangement des données par une clé (souvent la date) pour ne lire que le nécessaire." }
  - { term: DataFrame, en: DataFrame, def: "Tableau de données typé manipulé avec pandas, Polars ou Spark." }
  - { term: Idempotence, en: idempotence, def: "Relancer un traitement donne le même résultat, sans doublon." }
  - { term: CDC, en: Change Data Capture, def: "Capture des changements d'une base source à partir de son journal." }
  - { term: Entrepôt de données, en: data warehouse, def: "Base analytique structurée, optimisée pour les requêtes d'analyse." }
  - { term: Data lake, en: data lake, def: "Stockage de données brutes de tous types, à bas coût, sur stockage objet." }
  - { term: Lakehouse, en: lakehouse, def: "Data lake doté des garanties d'un entrepôt grâce aux formats de table ouverts (Iceberg, Delta)." }
  - { term: Architecture médaillon, en: medallion architecture, def: "Organisation en couches bronze (brut), silver (nettoyé), gold (métier)." }
  - { term: Table de faits, en: fact table, def: "Table des événements mesurables (ventes), avec mesures et clés vers les dimensions." }
  - { term: Dimension, en: dimension, def: "Table de contexte (produit, client, date) aux attributs descriptifs." }
  - { term: Schéma en étoile, en: star schema, def: "Table de faits au centre, reliée à des tables de dimensions." }
  - { term: Grain, en: grain, def: "Ce que représente exactement une ligne d'une table de faits." }
  - { term: SCD type 2, en: slowly changing dimension type 2, def: "Historisation d'une dimension par ajout de lignes datées." }
  - { term: dbt, en: data build tool, def: "Outil qui organise les transformations SQL en modèles versionnés, testés et documentés." }
  - { term: Orchestrateur, en: orchestrator, def: "Outil qui planifie, enchaîne et surveille les tâches d'un pipeline (Airflow, Dagster)." }
  - { term: Backfill, en: backfill, def: "Exécution rétroactive d'un pipeline sur des périodes passées." }
  - { term: Contrat de données, en: data contract, def: "Accord formalisé entre producteurs et consommateurs de données (schéma, qualité, fraîcheur)." }
  - { term: Shuffle, en: shuffle, def: "Redistribution coûteuse des données entre machines lors d'un groupement ou d'une jointure (Spark)." }
  - { term: Topic, en: topic, def: "Flux nommé d'événements dans Kafka, découpé en partitions." }
  - { term: Lignage, en: data lineage, def: "Traçabilité de l'origine et des dépendances d'une donnée." }
  - { term: Data mesh, en: data mesh, def: "Organisation où chaque domaine métier publie ses données comme des produits, sur une plateforme commune." }
modules:
  - id: m1
    title: Les fondations du data engineering
    level: 2
    summary: Le métier, les formats, pandas, un premier pipeline ETL.
    lessons:
      - id: de-metier
        title: Le métier et le cycle de vie de la donnée
        objectives:
          - Décrire le cycle de vie de la donnée
          - Distinguer batch et streaming, ETL et ELT
          - Connaître les qualités d'un pipeline professionnel
        docs:
          - { title: "dbt — ETL vs ELT", url: "https://www.getdbt.com/blog/etl-vs-elt" }
        quiz:
          - type: qcm
            q: Pourquoi l'ELT s'est-il imposé dans le cloud ?
            choices: ["Parce qu'il est plus ancien", "Stockage bon marché et calcul élastique : on charge brut et on transforme dans l'entrepôt", "Parce qu'il n'utilise pas SQL", "Parce qu'il est obligatoire"]
            answer: 1
            explain: Les données brutes sont conservées et peuvent être retraitées à tout moment.
          - type: qcm
            q: Un pipeline relancé crée des doublons. Quelle qualité lui manque ?
            choices: ["La rapidité", "L'idempotence", "La documentation", "Le streaming"]
            answer: 1
            explain: Un pipeline idempotent peut être relancé sans changer le résultat.
          - type: vf
            q: La majorité des besoins de données d'entreprise peuvent être servis en batch.
            answer: true
            explain: Le streaming se justifie pour les besoins réellement temps réel.
        flashcards:
          - { q: "Cycle de vie de la donnée", a: "Génération → ingestion → stockage → transformation → mise à disposition." }
          - { q: "Qualités d'un pipeline", a: "Fiable, idempotent, observable, testé, documenté, sécurisé, économe." }
        exercises:
          - id: ex-cycle
            type: ordre
            title: Le cycle de vie d'une donnée de vente
            statement: Remettez dans l'ordre les étapes du parcours d'une vente, du magasin au tableau de bord.
            items:
              - La caisse enregistre la vente dans la base de l'application
              - Un pipeline extrait les ventes de la veille (ingestion)
              - Les données brutes sont déposées dans le data lake (bronze)
              - Elles sont nettoyées et dédoublonnées (silver)
              - Elles sont modélisées en faits et dimensions (gold)
              - Des tests de qualité valident les tables
              - Le tableau de bord des ventes est rafraîchi
            model: Génération → ingestion → stockage brut → transformation → contrôle → mise à disposition.
      - id: de-formats
        title: Les formats de données et le partitionnement
        objectives:
          - Comparer CSV, JSON, Parquet et Avro
          - Expliquer l'intérêt du stockage en colonnes
          - Partitionner sans multiplier les petits fichiers
        docs:
          - { title: "Apache Parquet — documentation", url: "https://parquet.apache.org/docs/" }
          - { title: "Apache Iceberg", url: "https://iceberg.apache.org/" }
        quiz:
          - type: qcm
            q: Pourquoi Parquet accélère-t-il une requête qui ne lit que deux colonnes sur cent ?
            choices: ["Il est en texte", "Il est stocké en colonnes : on ne lit que les colonnes utiles", "Il n'est pas compressé", "Il trie les lignes"]
            answer: 1
            explain: Le stockage en colonnes évite de lire les 98 autres colonnes.
          - type: qcm
            q: Quel format est fréquent dans le streaming Kafka grâce à son schéma intégré ?
            choices: ["CSV", "Avro", "Parquet", "XLSX"]
            answer: 1
            explain: Avro, orienté lignes, gère bien l'évolution des schémas.
          - type: vf
            q: Partitionner par heure et par client est toujours une bonne idée.
            answer: false
            explain: Trop de partitions produit des millions de petits fichiers, ce qui ralentit tout.
        flashcards:
          - { q: "Lignes vs colonnes", a: "Lignes : écrire/lire des enregistrements entiers. Colonnes : analyser peu de colonnes sur beaucoup de lignes." }
          - { q: "Partition pruning", a: "Ne lire que les partitions concernées par le filtre (souvent la date)." }
        exercises:
          - id: ex-aplatir
            type: code
            lang: python
            title: Aplatir des commandes JSON
            statement: |
              Une API renvoie des commandes au format **JSON Lines** (un objet par ligne) avec des lignes de commande imbriquées. Pour les charger dans une table, il faut les **aplatir** : une ligne par produit commandé.

              Écrivez `aplatir(jsonl)` qui renvoie une liste de dictionnaires `{"commande_id", "client", "produit", "quantite"}`.
            setup: |
              jsonl = """{"id": 101, "client": {"nom": "Ada", "ville": "Lyon"}, "lignes": [{"produit": "clavier", "qte": 1}, {"produit": "souris", "qte": 2}]}
              {"id": 102, "client": {"nom": "Ken", "ville": "Lille"}, "lignes": [{"produit": "écran", "qte": 1}]}
              {"id": 103, "client": {"nom": "Grace", "ville": "Paris"}, "lignes": []}"""
            starter: |
              import json

              def aplatir(jsonl):
                  lignes = []
                  for texte in jsonl.splitlines():
                      commande = json.loads(texte)
                      # une ligne par produit de commande["lignes"]
                  return lignes

              for l in aplatir(jsonl):
                  print(l)
            solution: |
              import json

              def aplatir(jsonl):
                  lignes = []
                  for texte in jsonl.splitlines():
                      if not texte.strip():
                          continue
                      commande = json.loads(texte)
                      for l in commande["lignes"]:
                          lignes.append({
                              "commande_id": commande["id"],
                              "client": commande["client"]["nom"],
                              "produit": l["produit"],
                              "quantite": l["qte"],
                          })
                  return lignes

              for l in aplatir(jsonl):
                  print(l)
            tests:
              - { label: "Trois lignes de produits", code: "assert len(aplatir(jsonl)) == 3" }
              - { label: "Contenu exact", code: "assert aplatir(jsonl)[1] == {'commande_id': 101, 'client': 'Ada', 'produit': 'souris', 'quantite': 2}, aplatir(jsonl)[1]" }
              - { label: "Les lignes vides du fichier sont ignorées", code: "assert len(aplatir(jsonl + '\\n\\n')) == 3" }
            hints:
              - "Boucle imbriquée : pour chaque commande, pour chaque ligne de commande."
              - "commande[\"client\"][\"nom\"] pour accéder à la valeur imbriquée."
            model: "Le **grain** change : une commande devient plusieurs lignes. Remarquez que la commande 103, sans produit, disparaît : si on veut la garder (pour compter les commandes vides), il faut un autre traitement — c'est exactement le genre de décision à documenter."
          - id: ex-colonnes
            type: calcul
            title: Lignes ou colonnes ?
            statement: |
              Une table de 200 millions de lignes compte 50 colonnes de 8 octets chacune. Une requête calcule la somme d'une seule colonne. Répondez en Go (1 Go = 10⁹ octets).
            questions:
              - { q: "Volume lu en stockage orienté lignes (toutes les colonnes) ?", answer: 80, unit: Go, explain: "200 × 10⁶ × 50 × 8 = 80 × 10⁹ octets = 80 Go." }
              - { q: "Volume lu en stockage en colonnes (une seule colonne, sans compression) ?", answer: 1.6, tolerance: 0.01, unit: Go, explain: "200 × 10⁶ × 8 = 1,6 Go : 50 fois moins." }
              - { q: "Avec une compression de facteur 4 sur cette colonne ?", answer: 0.4, tolerance: 0.01, unit: Go, explain: "1,6 / 4 = 0,4 Go." }
      - id: de-pandas
        title: Manipuler des données avec pandas
        objectives:
          - Créer et lire des DataFrames
          - Filtrer, transformer, agréger et joindre
          - Traiter les valeurs manquantes
        docs:
          - { title: "pandas — 10 minutes to pandas", url: "https://pandas.pydata.org/docs/user_guide/10min.html" }
          - { title: "Polars — guide", url: "https://docs.pola.rs/" }
        quiz:
          - type: qcm
            q: Comment combiner deux conditions de filtre en pandas ?
            choices: ["df[cond1 and cond2]", "df[(cond1) & (cond2)]", "df.filter(cond1, cond2)", "df[cond1 && cond2]"]
            answer: 1
            explain: Opérateurs & et |, avec des parenthèses autour de chaque condition.
          - type: qcm
            q: Quel est l'équivalent pandas d'un LEFT JOIN ?
            choices: ["df.join_left()", "df.merge(autre, on=…, how=\"left\")", "df.concat()", "df.groupby()"]
            answer: 1
            explain: merge avec how="left".
          - type: vf
            q: pandas convient à des données qui tiennent en mémoire sur une machine.
            answer: true
            explain: Au-delà, on passe à Spark, à l'entrepôt, ou à des outils plus efficaces (Polars, DuckDB).
        flashcards:
          - { q: "groupby pandas", a: "df.groupby(\"ville\").agg(ca=(\"montant\", \"sum\")).reset_index()" }
          - { q: "Valeurs manquantes", a: "isna().sum(), dropna(subset=…), fillna(valeur)" }
        exercises:
          - id: ex-pandas-groupby
            type: code
            lang: python
            title: Le chiffre d'affaires par ville avec pandas
            statement: |
              Le DataFrame `ventes` (fourni) contient `client`, `ville`, `montant`, `statut`.

              Écrivez `resume(ventes)` qui renvoie un DataFrame avec une ligne par ville et deux colonnes `ca` (somme des montants) et `nb` (nombre de ventes), **en ne gardant que les ventes au statut « livrée »**, trié par `ca` décroissant. La ville doit être une colonne (pas l'index).
            setup: |
              import pandas as pd
              ventes = pd.DataFrame({
                  "client": ["Ada", "Linus", "Grace", "Ada", "Ken", "Linus", "Grace"],
                  "ville": ["Lyon", "Paris", "Lyon", "Lyon", "Lille", "Paris", "Lyon"],
                  "montant": [120, 80, 45, 60, 200, 30, 90],
                  "statut": ["livrée", "livrée", "annulée", "livrée", "livrée", "livrée", "livrée"],
              })
            starter: |
              import pandas as pd

              def resume(ventes):
                  # filtrer, grouper, agréger, trier
                  return ventes

              print(resume(ventes))
            solution: |
              import pandas as pd

              def resume(ventes):
                  livrees = ventes[ventes["statut"] == "livrée"]
                  r = livrees.groupby("ville").agg(ca=("montant", "sum"), nb=("montant", "count")).reset_index()
                  return r.sort_values("ca", ascending=False).reset_index(drop=True)

              print(resume(ventes))
            tests:
              - { label: "Colonnes ville, ca, nb", code: "assert list(resume(ventes).columns) == ['ville', 'ca', 'nb'], list(resume(ventes).columns)" }
              - { label: "Valeurs et ordre corrects", code: "r = resume(ventes); assert r['ville'].tolist() == ['Lyon', 'Lille', 'Paris'] and r['ca'].tolist() == [270, 200, 110] and r['nb'].tolist() == [3, 1, 2], r" }
            hints:
              - "Filtrer : ventes[ventes[\"statut\"] == \"livrée\"]"
              - "groupby(\"ville\").agg(ca=(\"montant\", \"sum\"), nb=(\"montant\", \"count\")).reset_index()"
              - "sort_values(\"ca\", ascending=False)"
            model: "C'est la même requête qu'en SQL : `WHERE statut = 'livrée' GROUP BY ville ORDER BY ca DESC`. `reset_index()` remet la ville en colonne, ce qui facilite l'export (CSV, base)."
          - id: ex-pandas-merge
            type: code
            lang: python
            title: Enrichir et nettoyer avec merge
            statement: |
              Écrivez `enrichir(commandes, clients)` qui :
              1. joint chaque commande à son client (`client_id`) pour récupérer la `region` (jointure **gauche** : on garde toutes les commandes) ;
              2. remplace les régions manquantes par `"inconnue"` ;
              3. renvoie le DataFrame avec les colonnes `commande_id`, `montant`, `region`.
            setup: |
              import pandas as pd
              commandes = pd.DataFrame({"commande_id": [1, 2, 3, 4], "client_id": [10, 11, 10, 99], "montant": [50.0, 20.0, 35.0, 80.0]})
              clients = pd.DataFrame({"client_id": [10, 11], "region": ["Bretagne", "Occitanie"]})
            starter: |
              import pandas as pd

              def enrichir(commandes, clients):
                  return commandes

              print(enrichir(commandes, clients))
            solution: |
              import pandas as pd

              def enrichir(commandes, clients):
                  r = commandes.merge(clients, on="client_id", how="left")
                  r["region"] = r["region"].fillna("inconnue")
                  return r[["commande_id", "montant", "region"]]

              print(enrichir(commandes, clients))
            tests:
              - { label: "Toutes les commandes sont conservées", code: "assert len(enrichir(commandes, clients)) == 4" }
              - { label: "Régions correctes, client inconnu géré", code: "assert enrichir(commandes, clients)['region'].tolist() == ['Bretagne', 'Occitanie', 'Bretagne', 'inconnue']" }
              - { label: "Colonnes demandées", code: "assert list(enrichir(commandes, clients).columns) == ['commande_id', 'montant', 'region']" }
            hints:
              - "commandes.merge(clients, on=\"client_id\", how=\"left\")"
              - "r[\"region\"].fillna(\"inconnue\")"
            model: "Avec une jointure interne (`how=\"inner\"`), la commande 4 (client 99 inconnu) disparaîtrait silencieusement et le chiffre d'affaires serait sous-estimé. Le client inconnu est plutôt un problème de qualité à signaler."
      - id: de-etl
        title: Construire un pipeline ETL en Python
        objectives:
          - Structurer un pipeline en fonctions extraire, transformer, charger
          - Rendre le chargement idempotent
          - Choisir entre chargement complet et incrémental
        docs:
          - { title: "Python — logging (tutoriel)", url: "https://docs.python.org/fr/3/howto/logging.html" }
          - { title: "Debezium — Change Data Capture", url: "https://debezium.io/documentation/reference/stable/index.html" }
        quiz:
          - type: qcm
            q: Quelle stratégie rend un chargement quotidien idempotent ?
            choices: ["Ajouter les lignes à chaque exécution", "Remplacer la partition du jour (supprimer puis réinsérer)", "Charger deux fois pour être sûr", "Ne jamais relancer"]
            answer: 1
            explain: Relancer remplace la même partition, sans doublon.
          - type: qcm
            q: Qu'est-ce que le CDC ?
            choices: ["Un format de fichier", "La capture des changements d'une base à partir de son journal", "Un orchestrateur", "Un test de qualité"]
            answer: 1
            explain: Le Change Data Capture permet un chargement incrémental fidèle.
        flashcards:
          - { q: "Full load vs incrémental", a: "Tout recharger / ne traiter que les nouveautés (date de modification, CDC)." }
        exercises:
          - id: ex-pipeline
            type: code
            lang: python
            title: Un pipeline idempotent
            statement: |
              Complétez le pipeline :
              - `transformer(lignes)` : convertit `montant` en `float` (la virgule décimale doit être acceptée), met `produit` en minuscules sans espaces autour, et renvoie `(propres, rejets)` — les lignes dont le montant est invalide vont dans `rejets` ;
              - `charger(lignes, entrepot)` : remplace dans `entrepot` (une liste) les lignes des **dates présentes dans `lignes`** par les nouvelles. Relancer le chargement ne doit **jamais** créer de doublon.
            setup: |
              source = [
                  {"date": "2026-10-05", "produit": " Clavier ", "montant": "89.9"},
                  {"date": "2026-10-05", "produit": "Souris", "montant": "29,9"},
                  {"date": "2026-10-05", "produit": "Écran", "montant": "n/a"},
              ]
            starter: |
              def transformer(lignes):
                  propres, rejets = [], []
                  for l in lignes:
                      propres.append(l)
                  return propres, rejets

              def charger(lignes, entrepot):
                  entrepot.extend(lignes)

              entrepot = [{"date": "2026-10-04", "produit": "clavier", "montant": 89.9}]
              propres, rejets = transformer(source)
              charger(propres, entrepot)
              charger(propres, entrepot)
              print(entrepot, rejets)
            solution: |
              def transformer(lignes):
                  propres, rejets = [], []
                  for l in lignes:
                      try:
                          propres.append({
                              "date": l["date"],
                              "produit": l["produit"].strip().lower(),
                              "montant": float(l["montant"].replace(",", ".")),
                          })
                      except ValueError:
                          rejets.append(l)
                  return propres, rejets

              def charger(lignes, entrepot):
                  dates = {l["date"] for l in lignes}
                  entrepot[:] = [e for e in entrepot if e["date"] not in dates] + lignes

              entrepot = [{"date": "2026-10-04", "produit": "clavier", "montant": 89.9}]
              propres, rejets = transformer(source)
              charger(propres, entrepot)
              charger(propres, entrepot)
              print(entrepot, rejets)
            tests:
              - { label: "Transformation et rejets", code: "p, r = transformer(source); assert p == [{'date': '2026-10-05', 'produit': 'clavier', 'montant': 89.9}, {'date': '2026-10-05', 'produit': 'souris', 'montant': 29.9}] and len(r) == 1, (p, r)" }
              - { label: "Idempotent : trois chargements → aucun doublon", code: "e = [{'date': '2026-10-04', 'produit': 'x', 'montant': 1.0}]\np, _ = transformer(source)\nfor _ in range(3):\n    charger(p, e)\nassert len(e) == 3, e" }
              - { label: "Les autres dates sont conservées", code: "e = [{'date': '2026-10-04', 'produit': 'x', 'montant': 1.0}]\ncharger(transformer(source)[0], e)\nassert any(x['date'] == '2026-10-04' for x in e)" }
              - { label: "La liste entrepot est modifiée sur place", code: "e = []\nidentite = id(e)\ncharger(transformer(source)[0], e)\nassert id(e) == identite and len(e) == 2" }
            hints:
              - "try / except ValueError autour de la conversion du montant."
              - "Pour remplacer une partition : garder les lignes dont la date n'est pas rechargée, puis ajouter les nouvelles."
              - "entrepot[:] = … modifie la liste sur place (sans en créer une nouvelle)."
            model: "Dans une vraie base, le même principe s'écrit `DELETE FROM ventes WHERE date = '2026-10-05'` puis `INSERT`, dans **une transaction** — ou un `MERGE`. Le chargement naïf (`extend`) doublait les ventes à chaque relance."
  - id: m2
    title: Stocker, modéliser, transformer, orchestrer
    level: 2
    summary: Entrepôts et lakehouse, modélisation dimensionnelle, dbt, Airflow, qualité des données.
    lessons:
      - id: de-entrepot
        title: Entrepôt, data lake et lakehouse
        objectives:
          - Distinguer entrepôt, data lake et lakehouse
          - Organiser les données en couches bronze, silver, gold
          - Éviter le marécage de données
        docs:
          - { title: "Databricks — Architecture médaillon", url: "https://www.databricks.com/glossary/medallion-architecture" }
          - { title: "Delta Lake", url: "https://delta.io/" }
        quiz:
          - type: qcm
            q: Pourquoi conserver la couche bronze intacte ?
            choices: ["Pour occuper de la place", "Pour pouvoir tout recalculer si une transformation était fausse", "Pour les analystes", "C'est obligatoire légalement"]
            answer: 1
            explain: Les données brutes sont le filet de sécurité de tout le pipeline.
          - type: qcm
            q: Qu'apporte un format de table comme Iceberg ou Delta à un data lake ?
            choices: ["Une interface graphique", "Des transactions ACID, des schémas et le voyage dans le temps", "Un réseau plus rapide", "Le chiffrement"]
            answer: 1
            explain: C'est le principe du lakehouse.
        flashcards:
          - { q: "Bronze / silver / gold", a: "Brut intact / nettoyé et conforme / prêt pour le métier." }
          - { q: "Data swamp", a: "Data lake désorganisé, sans catalogue ni qualité." }
        exercises:
          - id: ex-medaillon
            type: ordre
            title: Bronze, silver, gold
            statement: Remettez dans l'ordre le parcours d'un fichier de ventes à travers l'architecture médaillon.
            items:
              - Le fichier CSV reçu est copié tel quel dans la zone bronze, daté
              - Les types sont convertis et les colonnes renommées
              - Les doublons et lignes invalides sont écartés (silver)
              - Les ventes sont jointes aux dimensions produit et magasin
              - Le chiffre d'affaires quotidien par magasin est agrégé (gold)
              - Le tableau de bord lit la table gold
            model: Chaque couche augmente la qualité et la valeur métier, sans jamais modifier la précédente.
      - id: de-modelisation
        title: La modélisation dimensionnelle
        objectives:
          - Distinguer faits et dimensions
          - Interroger un schéma en étoile
          - Définir le grain et historiser une dimension (SCD type 2)
        docs:
          - { title: "Kimball Group — Dimensional Modeling Techniques", url: "https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/" }
        quiz:
          - type: qcm
            q: Où se trouve le montant d'une vente dans un schéma en étoile ?
            choices: ["Dans la dimension produit", "Dans la table de faits", "Dans la dimension date", "Dans un fichier à part"]
            answer: 1
            explain: Les mesures sont dans la table de faits.
          - type: qcm
            q: Un client déménage ; on veut que ses achats passés restent rattachés à l'ancienne ville. Quelle stratégie ?
            choices: ["SCD type 1", "SCD type 2", "Supprimer le client", "Créer un nouveau client sans lien"]
            answer: 1
            explain: Le type 2 ajoute une nouvelle version datée et conserve l'historique.
          - type: vf
            q: Il faut définir le grain de la table de faits avant de la construire.
            answer: true
            explain: Mélanger deux grains fausse les agrégats.
        flashcards:
          - { q: "Faits / dimensions", a: "Événements et mesures / contexte et attributs." }
          - { q: "SCD type 2", a: "Nouvelle ligne par version, avec valide_du, valide_au, actuel." }
        exercises:
          - id: ex-etoile
            type: code
            lang: sql
            title: Interroger le schéma en étoile
            setup: "@entrepot"
            statement: |
              Base **Entrepôt de données**. Calculez le chiffre d'affaires (`ca`, somme de `montant`) par **trimestre** et par **catégorie** de produit, trié par trimestre puis par chiffre d'affaires décroissant.
              Colonnes attendues : `trimestre`, `categorie`, `ca`.
            starter: |
              SELECT f.montant
              FROM fait_ventes AS f;
            solution: |
              SELECT d.trimestre, p.categorie, SUM(f.montant) AS ca
              FROM fait_ventes AS f
              JOIN dim_date AS d ON d.date_id = f.date_id
              JOIN dim_produit AS p ON p.produit_id = f.produit_id
              GROUP BY d.trimestre, p.categorie
              ORDER BY d.trimestre, ca DESC;
            ordered: true
            hints:
              - "Deux jointures : dim_date (trimestre) et dim_produit (categorie)."
              - "GROUP BY d.trimestre, p.categorie"
            model: "Toutes les questions d'analyse suivent ce motif : faits + dimensions nécessaires + GROUP BY sur les attributs de dimension. C'est ce qui rend le schéma en étoile si simple à utiliser."
          - id: ex-scd2
            type: code
            lang: sql
            title: Historiser un déménagement (SCD type 2)
            setup: |
              CREATE TABLE dim_client (
                cle INTEGER PRIMARY KEY,
                client_id INTEGER,
                nom TEXT,
                ville TEXT,
                valide_du DATE,
                valide_au DATE,
                actuel INTEGER
              );
              INSERT INTO dim_client VALUES
                (1, 42, 'Ada', 'Lyon', '2025-01-15', NULL, 1),
                (2, 43, 'Ken', 'Lille', '2025-03-02', NULL, 1);
            statement: |
              Le client `42` (Ada) a déménagé à **Lille** le **2026-10-01**. Appliquez une historisation de type 2 :
              1. clôturez la version actuelle : `valide_au = '2026-09-30'`, `actuel = 0` ;
              2. insérez la nouvelle version : clé `3`, ville `Lille`, `valide_du = '2026-10-01'`, `valide_au` NULL, `actuel = 1`.
            starter: |
              UPDATE dim_client SET ville = 'Lille' WHERE client_id = 42;
            solution: |
              UPDATE dim_client
              SET valide_au = '2026-09-30', actuel = 0
              WHERE client_id = 42 AND actuel = 1;
              INSERT INTO dim_client (cle, client_id, nom, ville, valide_du, valide_au, actuel)
              VALUES (3, 42, 'Ada', 'Lille', '2026-10-01', NULL, 1);
            hints:
              - "Le code de départ fait un SCD type 1 : il écrase l'historique."
              - "Un UPDATE pour clôturer, un INSERT pour la nouvelle version."
            model: "Les ventes passées d'Ada restent rattachées à la clé 1 (Lyon) ; les nouvelles utiliseront la clé 3 (Lille). La colonne `actuel` permet de trouver la version courante en un filtre."
      - id: de-dbt
        title: Transformer en SQL avec dbt
        objectives:
          - Écrire des modèles dbt avec ref et source
          - Déclarer des tests de données en YAML
          - Structurer un projet en staging, intermediate, marts
        docs:
          - { title: "dbt — Documentation", url: "https://docs.getdbt.com/docs/introduction" }
          - { title: "dbt — Data tests", url: "https://docs.getdbt.com/docs/build/data-tests" }
        quiz:
          - type: qcm
            q: À quoi sert {{ ref('stg_commandes') }} dans un modèle dbt ?
            choices: ["À commenter", "À faire référence à un autre modèle et déclarer la dépendance", "À créer une table", "À tester"]
            answer: 1
            explain: dbt en déduit le graphe des dépendances et l'ordre d'exécution.
          - type: qcm
            q: Quelle commande construit et teste les modèles dans l'ordre ?
            choices: ["dbt compile", "dbt build", "dbt docs", "dbt init"]
            answer: 1
            explain: build = run + test, en suivant le graphe.
        flashcards:
          - { q: "Tests dbt génériques", a: "unique, not_null, accepted_values, relationships." }
          - { q: "Couches dbt", a: "staging (stg_), intermediate (int_), marts (fct_, dim_)." }
        exercises:
          - id: ex-dbt-tests
            type: config
            title: Déclarer les tests d'un modèle dbt
            filename: models/staging/schema.yml
            syntax: yaml
            statement: |
              Pour le modèle `stg_commandes`, déclarez :
              - une description du modèle ;
              - sur `commande_id` : les tests `unique` et `not_null` ;
              - sur `statut` : le test `accepted_values` avec les valeurs `livrée`, `en cours`, `annulée`.

              Utilisez la clé `data_tests` et, pour `accepted_values`, placez les valeurs sous `arguments`.
            starter: |
              version: 2
              models:
                - name: stg_commandes
            solution: |
              version: 2

              models:
                - name: stg_commandes
                  description: Commandes nettoyées, une ligne par commande.
                  columns:
                    - name: commande_id
                      data_tests:
                        - unique
                        - not_null
                    - name: statut
                      data_tests:
                        - accepted_values:
                            arguments:
                              values: ["livrée", "en cours", "annulée"]
            checks:
              - { label: "Le modèle a une description", path: "models[*].description", exists: true }
              - { label: "commande_id : unique", regex: "name:\\s*commande_id[\\s\\S]*?data_tests:[\\s\\S]*?-\\s*unique" }
              - { label: "commande_id : not_null", regex: "name:\\s*commande_id[\\s\\S]*?data_tests:[\\s\\S]*?-\\s*not_null" }
              - { label: "statut : accepted_values", path: "models[*].columns[*].data_tests[*].accepted_values", exists: true }
              - { label: "Valeurs acceptées : livrée, en cours, annulée", path: "models[*].columns[*].data_tests[*].accepted_values.arguments.values", contains: "en cours" }
            hints:
              - "columns est une liste ; chaque colonne a un name et des data_tests."
              - "accepted_values: puis, indenté, arguments: puis values: [ … ]"
            model: "À chaque `dbt build`, ces tests s'exécutent : un doublon de commande ou un statut inattendu (« livree » sans accent, par exemple) fait échouer la chaîne avant que les tableaux de bord ne soient faux."
          - id: ex-dbt-staging
            type: code
            lang: sql
            title: Écrire un modèle de staging
            setup: "@boutique"
            statement: |
              Écrivez la requête d'un modèle `stg_commandes` (ici directement sur la table `commandes`) qui renvoie :
              - `commande_id` (renommage de `id`),
              - `client_id`,
              - `date_commande`,
              - `statut` en **majuscules**,
              - `est_livree` : 1 si le statut est « livrée », 0 sinon.
            starter: |
              SELECT *
              FROM commandes;
            solution: |
              SELECT
                id AS commande_id,
                client_id,
                date_commande,
                UPPER(statut) AS statut,
                CASE WHEN statut = 'livrée' THEN 1 ELSE 0 END AS est_livree
              FROM commandes;
            hints:
              - "id AS commande_id pour renommer."
              - "CASE WHEN statut = 'livrée' THEN 1 ELSE 0 END AS est_livree"
            model: "Un modèle de staging reste simple : renommer, typer, normaliser, ajouter des indicateurs. Les jointures et agrégats viennent dans les couches suivantes. (Remarque : `UPPER` de SQLite ne met en majuscules que les lettres ASCII : « livrée » devient « LIVRéE ».)"
      - id: de-orchestration
        title: Orchestrer avec Airflow
        objectives:
          - Écrire un DAG avec tâches et dépendances
          - Configurer planification, réessais et rattrapage
          - Distinguer orchestration et calcul
        docs:
          - { title: "Apache Airflow — Documentation", url: "https://airflow.apache.org/docs/apache-airflow/stable/index.html" }
          - { title: "Airflow — TaskFlow API", url: "https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/taskflow.html" }
          - { title: "Dagster — documentation", url: "https://docs.dagster.io/" }
        quiz:
          - type: qcm
            q: Que fait retries=3 sur un DAG ?
            choices: ["Exécute le DAG trois fois par jour", "Retente jusqu'à 3 fois une tâche en échec", "Garde 3 versions", "Lance 3 tâches en parallèle"]
            answer: 1
            explain: Utile pour les erreurs temporaires (réseau, API indisponible).
          - type: qcm
            q: Qu'est-ce qu'un backfill ?
            choices: ["Un remplissage de disque", "L'exécution du DAG sur des périodes passées", "Une sauvegarde", "Un test"]
            answer: 1
            explain: On rattrape des périodes après une correction ou à la création du pipeline.
          - type: vf
            q: Il est recommandé de faire les calculs lourds directement dans les processus d'Airflow.
            answer: false
            explain: Airflow orchestre ; le calcul se fait dans l'entrepôt, Spark ou des conteneurs.
        flashcards:
          - { q: "DAG Airflow (TaskFlow)", a: "@dag(schedule=…, start_date=…) + @task ; dépendances par appels ou >>." }
          - { q: "Idempotence dans Airflow", a: "Chaque exécution traite la période de sa date logique." }
        exercises:
          - id: ex-dag
            type: config
            title: Écrire un DAG Airflow
            filename: dags/pipeline_ventes.py
            syntax: text
            statement: |
              Écrivez un DAG Airflow (syntaxe TaskFlow d'Airflow 3) nommé par la fonction `pipeline_ventes` qui :
              - s'exécute **chaque jour à 3 h** (expression cron `0 3 * * *`) ;
              - commence le `2026-01-01`, **sans rattrapage** (`catchup=False`) ;
              - retente **3 fois** une tâche en échec (`default_args` avec `retries`) ;
              - définit trois tâches `extraire`, `transformer`, `charger`, enchaînées dans cet ordre ;
              - se termine par l'appel `pipeline_ventes()`.
            starter: |
              from airflow.sdk import dag, task

              def pipeline_ventes():
                  pass
            solution: |
              from datetime import datetime
              from airflow.sdk import dag, task

              @dag(
                  schedule="0 3 * * *",
                  start_date=datetime(2026, 1, 1),
                  catchup=False,
                  default_args={"retries": 3},
                  tags=["ventes"],
              )
              def pipeline_ventes():

                  @task
                  def extraire():
                      return [{"produit": "clavier", "montant": "89.9"}]

                  @task
                  def transformer(lignes):
                      return [{**l, "montant": float(l["montant"])} for l in lignes]

                  @task
                  def charger(lignes):
                      print(f"{len(lignes)} lignes chargées")

                  charger(transformer(extraire()))

              pipeline_ventes()
            checks:
              - { label: "Décorateur @dag", regex: "^@dag\\(" }
              - { label: "Planification quotidienne à 3 h", regex: "schedule\\s*=\\s*[\"']0 3 \\* \\* \\*[\"']" }
              - { label: "Date de début 2026-01-01", regex: "start_date\\s*=\\s*datetime\\(\\s*2026\\s*,\\s*1\\s*,\\s*1\\s*\\)" }
              - { label: "Sans rattrapage", regex: "catchup\\s*=\\s*False" }
              - { label: "3 réessais", regex: "[\"']retries[\"']\\s*:\\s*3" }
              - { label: "Trois tâches @task", regex: "@task[\\s\\S]*def extraire[\\s\\S]*@task[\\s\\S]*def transformer[\\s\\S]*@task[\\s\\S]*def charger" }
              - { label: "Enchaînement extraire → transformer → charger", regex: "charger\\(\\s*transformer\\(\\s*extraire\\(\\s*\\)\\s*\\)\\s*\\)|extraire\\(?\\)?\\s*>>\\s*transformer\\(?\\)?\\s*>>\\s*charger" }
              - { label: "Le DAG est instancié", regex: "^pipeline_ventes\\(\\)\\s*$" }
            hints:
              - "from datetime import datetime pour start_date."
              - "Les tâches sont des fonctions décorées par @task, définies dans la fonction du DAG."
              - "charger(transformer(extraire())) crée les dépendances."
            model: "Avec la syntaxe TaskFlow, les valeurs renvoyées passent d'une tâche à l'autre (par XCom). Pour de gros volumes, on ne fait pas transiter les données elles-mêmes, mais un chemin de fichier ou un nom de table."
      - id: de-qualite
        title: La qualité des données
        objectives:
