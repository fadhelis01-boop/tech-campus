          - { title: "Soda — documentation", url: "https://docs.soda.io/" }
        quiz:
          - type: qcm
            q: « La dernière ligne de la table date de 3 jours » relève de quelle dimension ?
            choices: ["Unicité", "Fraîcheur", "Validité", "Cohérence"]
            answer: 1
            explain: Les données ne sont plus à jour.
          - type: qcm
            q: Une colonne de la source a été renommée sans prévenir et le pipeline casse. Que formaliser pour l'éviter ?
            choices: ["Un SLA réseau", "Un contrat de données", "Un index", "Une sauvegarde"]
            answer: 1
            explain: Le contrat rend les changements de schéma visibles et testables en amont.
        flashcards:
          - { q: "6 dimensions de la qualité", a: "Complétude, unicité, validité, cohérence, fraîcheur, exactitude." }
          - { q: "Graduer la réponse", a: "Bloquer (faux résultats), alerter (anomalie), quarantaine (lignes invalides)." }
        exercises:
          - id: ex-qualite
            type: code
            lang: python
            title: Écrire des contrôles de qualité
            statement: |
              Écrivez `controler(lignes, volume_veille)` qui renvoie un dictionnaire `{"bloquant": [...], "alertes": [...]}` de messages :
              - **bloquant** `"doublons commande_id"` s'il existe des `commande_id` en double ;
              - **bloquant** `"montant négatif"` si un `montant` est négatif ;
              - **alerte** `"volume en baisse"` si le nombre de lignes est inférieur à 80 % de `volume_veille` ;
              - **alerte** `"client_id manquant"` si un `client_id` vaut `None`.
            setup: |
              lot = [
                  {"commande_id": 1, "client_id": 10, "montant": 50.0},
                  {"commande_id": 2, "client_id": None, "montant": 20.0},
                  {"commande_id": 2, "client_id": 11, "montant": -5.0},
              ]
            starter: |
              def controler(lignes, volume_veille):
                  bloquant, alertes = [], []
                  return {"bloquant": bloquant, "alertes": alertes}

              print(controler(lot, 10))
            solution: |
              def controler(lignes, volume_veille):
                  bloquant, alertes = [], []
                  ids = [l["commande_id"] for l in lignes]
                  if len(ids) != len(set(ids)):
                      bloquant.append("doublons commande_id")
                  if any(l["montant"] < 0 for l in lignes):
                      bloquant.append("montant négatif")
                  if len(lignes) < 0.8 * volume_veille:
                      alertes.append("volume en baisse")
                  if any(l["client_id"] is None for l in lignes):
                      alertes.append("client_id manquant")
                  return {"bloquant": bloquant, "alertes": alertes}

              print(controler(lot, 10))
            tests:
              - { label: "Tous les problèmes du lot détectés", code: "assert controler(lot, 10) == {'bloquant': ['doublons commande_id', 'montant négatif'], 'alertes': ['volume en baisse', 'client_id manquant']}, controler(lot, 10)" }
              - { label: "Lot sain → aucun message", code: "assert controler([{'commande_id': 1, 'client_id': 3, 'montant': 1.0}], 1) == {'bloquant': [], 'alertes': []}" }
              - { label: "Seuil de volume à 80 %", code: "ok = [{'commande_id': i, 'client_id': 1, 'montant': 1.0} for i in range(8)]\nassert controler(ok, 10)['alertes'] == [] and controler(ok[:7], 10)['alertes'] == ['volume en baisse']" }
            hints:
              - "Doublons : comparer len(ids) et len(set(ids))."
              - "any(condition for l in lignes) pour tester toutes les lignes."
            model: "C'est ce que font les outils de qualité (tests dbt, Great Expectations, Soda), configurés en YAML plutôt qu'en Python. Le pipeline s'arrête sur un contrôle bloquant ; les alertes partent vers l'équipe sans interrompre la publication."
  - id: m3
    title: Big data, temps réel et plateformes
    level: 3
    summary: Spark, streaming avec Kafka, plateformes cloud, gouvernance, projet de bout en bout.
    lessons:
      - id: de-spark
        title: Le traitement distribué avec Spark
        objectives:
          - Expliquer partitions, pilote et exécuteurs
          - Distinguer transformations et actions (évaluation paresseuse)
          - Limiter le shuffle et choisir l'outil adapté au volume
        docs:
          - { title: "Apache Spark — Quick Start", url: "https://spark.apache.org/docs/latest/quick-start.html" }
          - { title: "Spark SQL, DataFrames and Datasets Guide", url: "https://spark.apache.org/docs/latest/sql-programming-guide.html" }
          - { title: "DuckDB — documentation", url: "https://duckdb.org/docs/" }
        quiz:
          - type: qcm
            q: Que déclenche réellement un calcul dans Spark ?
            choices: ["filter", "groupBy", "Une action comme count ou write", "select"]
            answer: 2
            explain: Les transformations construisent un plan ; les actions l'exécutent.
          - type: qcm
            q: Quelle opération provoque généralement un shuffle ?
            choices: ["filter", "select", "groupBy", "withColumn"]
            answer: 2
            explain: Le regroupement par clé oblige à redistribuer les données.
          - type: vf
            q: Spark est toujours le meilleur choix, même pour 2 Go de données.
            answer: false
            explain: DuckDB, Polars ou l'entrepôt sont souvent plus simples et plus rapides à cette échelle.
        flashcards:
          - { q: "Broadcast join", a: "Copier une petite table sur chaque machine pour éviter le shuffle." }
          - { q: "Skew", a: "Déséquilibre : une clé très fréquente surcharge une seule partition." }
        exercises:
          - id: ex-mapreduce
            type: code
            lang: python
            title: Le principe du calcul distribué
            statement: |
              Simulez le calcul distribué d'un chiffre d'affaires par région :
              1. `calcul_local(partition)` : chaque « exécuteur » agrège **sa** partition (liste de ventes `(region, montant)`) en un dictionnaire `{region: total}` ;
              2. `combiner(resultats)` : le « pilote » additionne les résultats partiels de toutes les partitions.

              `ca_distribue(partitions)` (fournie) enchaîne les deux.
            setup: |
              partitions = [
                  [("Nord", 100), ("Sud", 50), ("Nord", 20)],
                  [("Sud", 30), ("Est", 70)],
                  [("Nord", 5), ("Est", 25), ("Sud", 10)],
              ]
            starter: |
              def calcul_local(partition):
                  totaux = {}
                  return totaux

              def combiner(resultats):
                  total = {}
                  return total

              def ca_distribue(partitions):
                  return combiner([calcul_local(p) for p in partitions])

              print(ca_distribue(partitions))
            solution: |
              def calcul_local(partition):
                  totaux = {}
                  for region, montant in partition:
                      totaux[region] = totaux.get(region, 0) + montant
                  return totaux

              def combiner(resultats):
                  total = {}
                  for r in resultats:
                      for region, montant in r.items():
                          total[region] = total.get(region, 0) + montant
                  return total

              def ca_distribue(partitions):
                  return combiner([calcul_local(p) for p in partitions])

              print(ca_distribue(partitions))
            tests:
              - { label: "Agrégat local d'une partition", code: "assert calcul_local(partitions[0]) == {'Nord': 120, 'Sud': 50}" }
              - { label: "Résultat global", code: "assert ca_distribue(partitions) == {'Nord': 125, 'Sud': 90, 'Est': 95}, ca_distribue(partitions)" }
            hints:
              - "calcul_local : le motif du regroupement avec dict.get(cle, 0)."
              - "combiner : même motif, sur chaque dictionnaire partiel."
            model: "Pré-agréger localement avant d'échanger les données (ce que Spark fait automatiquement pour une somme) réduit énormément le volume du shuffle : on n'échange que quelques totaux par partition au lieu de toutes les lignes."
      - id: de-streaming
        title: Le streaming avec Kafka
        objectives:
          - Expliquer topics, partitions, offsets, groupes de consommateurs
