        exercises:
          - id: ex-fenetres
            type: code
            lang: python
            title: Agrégats par fenêtres de 5 minutes
            statement: |
              Des événements de paiement arrivent, chacun `{"id", "minute", "montant"}` (`minute` = minute de l'événement depuis minuit). Certains sont livrés **deux fois** (même `id`).

              Écrivez `par_fenetre(evenements, taille=5)` qui renvoie un dictionnaire `{debut_de_fenetre: total}` :
              - fenêtres **fixes** : un événement de la minute 7 va dans la fenêtre qui commence à 5 ;
              - chaque `id` n'est compté **qu'une fois**.
            setup: |
              evenements = [
                  {"id": "p1", "minute": 0, "montant": 10},
                  {"id": "p2", "minute": 3, "montant": 15},
                  {"id": "p3", "minute": 7, "montant": 20},
                  {"id": "p2", "minute": 3, "montant": 15},
                  {"id": "p4", "minute": 12, "montant": 5},
                  {"id": "p5", "minute": 9, "montant": 30},
              ]
            starter: |
              def par_fenetre(evenements, taille=5):
                  totaux = {}
                  for e in evenements:
                      totaux[e["minute"]] = totaux.get(e["minute"], 0) + e["montant"]
                  return totaux

              print(par_fenetre(evenements))
            solution: |
              def par_fenetre(evenements, taille=5):
                  totaux = {}
                  vus = set()
                  for e in evenements:
                      if e["id"] in vus:
                          continue
                      vus.add(e["id"])
                      debut = (e["minute"] // taille) * taille
                      totaux[debut] = totaux.get(debut, 0) + e["montant"]
                  return totaux

              print(par_fenetre(evenements))
            tests:
              - { label: "Fenêtres de 5 minutes, doublon ignoré", code: "assert par_fenetre(evenements) == {0: 25, 5: 50, 10: 5}, par_fenetre(evenements)" }
              - { label: "Fenêtres de 10 minutes", code: "assert par_fenetre(evenements, 10) == {0: 75, 10: 5}" }
            hints:
              - "Début de fenêtre : (minute // taille) * taille."
              - "Un ensemble des id déjà vus permet d'ignorer les doublons."
            model: "Les moteurs de streaming (Flink, Spark Structured Streaming) font exactement cela, en continu et à grande échelle, en gérant en plus les événements en retard (watermarks) et l'état distribué."
      - id: de-plateformes
        title: Les plateformes data du cloud
        objectives:
          - Situer BigQuery, Snowflake, Databricks, Redshift, Fabric
          - Comprendre la séparation stockage/calcul et la facturation à l'usage
          - Maîtriser le coût des requêtes
        docs:
          - { title: "BigQuery — Tarifs", url: "https://cloud.google.com/bigquery/pricing" }
          - { title: "Snowflake — Key concepts", url: "https://docs.snowflake.com/en/user-guide/intro-key-concepts" }
          - { title: "Microsoft Fabric — Vue d'ensemble", url: "https://learn.microsoft.com/fr-fr/fabric/fundamentals/microsoft-fabric-overview" }
        quiz:
          - type: qcm
            q: Dans BigQuery facturé au volume lu, un LIMIT 10 réduit-il le coût d'un SELECT * ?
            choices: ["Oui, à 10 lignes", "Non, les colonnes sont lues en entier", "Oui, de moitié", "La requête est gratuite"]
            answer: 1
            explain: Il faut sélectionner les colonnes utiles et filtrer sur la partition.
          - type: qcm
            q: Quelle plateforme est centrée sur le lakehouse, Spark et Delta Lake ?
            choices: ["Redshift", "Databricks", "BigQuery", "Power BI"]
            answer: 1
            explain: Databricks a popularisé le lakehouse.
        flashcards:
          - { q: "Séparation stockage/calcul", a: "Données sur stockage bon marché ; calcul allumé à la demande." }
        exercises:
          - id: ex-cout-requete
            type: calcul
            title: Le coût d'une requête
            statement: |
              Tarif **fictif** pour l'exercice : 6 € par To lu. Une table de ventes fait 4 To, avec 40 colonnes de taille équivalente, partitionnée par jour sur 400 jours (volume égal chaque jour). Répondez en euros (2 décimales).
            questions:
              - { q: "Coût d'un SELECT * sur toute la table ?", answer: 24, tolerance: 0.01, unit: €, explain: "4 To × 6 € = 24 €." }
              - { q: "Coût en ne sélectionnant que 2 colonnes, sur toute la période ?", answer: 1.2, tolerance: 0.01, unit: €, explain: "2/40 de 4 To = 0,2 To → 1,20 €." }
              - { q: "Coût avec 2 colonnes et un filtre sur les 30 derniers jours (partitions) ?", answer: 0.09, tolerance: 0.001, unit: €, explain: "0,2 To × 30/400 = 0,015 To → 0,09 €." }
      - id: de-gouvernance
        title: Gouvernance, catalogue et data mesh
        objectives:
          - Connaître les briques de la gouvernance des données
          - Utiliser le lignage pour diagnostiquer et sécuriser les changements
          - Comprendre l'approche data mesh
        docs:
          - { title: "OpenLineage", url: "https://openlineage.io/docs/" }
          - { title: "Martin Fowler — Data Mesh Principles", url: "https://martinfowler.com/articles/data-mesh-principles.html" }
        quiz:
          - type: qcm
            q: À quoi sert le lignage des données ?
            choices: ["À chiffrer les données", "À connaître l'origine d'une donnée et tout ce qui en dépend", "À compresser", "À sauvegarder"]
            answer: 1
            explain: Il accélère les diagnostics et sécurise les modifications.
          - type: qcm
            q: Dans un data mesh, qui est responsable des données de ventes ?
            choices: ["Une équipe data centrale unique", "Le domaine métier des ventes, qui les publie comme un produit", "Le fournisseur cloud", "Personne"]
            answer: 1
            explain: Responsabilité par domaine, sur une plateforme commune.
        flashcards:
          - { q: "Briques de gouvernance", a: "Catalogue, lignage, glossaire, accès, qualité, conformité." }
        exercises:
          - id: ex-catalogue
            type: projet
            title: Documenter un produit de données
            statement: |
              Rédigez la fiche de catalogue de la table `gold.ca_quotidien_magasin` (chiffre d'affaires quotidien par magasin) : description, grain, propriétaire, sources (lignage), fréquence et heure de mise à jour, règles de qualité, présence ou non de données personnelles, durée de conservation, exemples de questions auxquelles elle répond.
            rubric:
              - Description compréhensible par un non-spécialiste
              - Grain précis (une ligne = un magasin × un jour)
              - Propriétaire et contact identifiés
              - Lignage (tables sources)
              - Fraîcheur (fréquence, heure)
              - Règles de qualité explicites
              - Statut RGPD et conservation
            model: |
              **gold.ca_quotidien_magasin** — Chiffre d'affaires TTC et nombre de tickets par magasin et par jour.
              - **Grain** : une ligne par magasin et par jour calendaire.
              - **Propriétaire** : direction commerciale (data owner) ; équipe data ventes (support).
              - **Sources** : silver.ventes_lignes, silver.magasins, dim_date.
              - **Fraîcheur** : chaque jour avant 6 h, données de la veille.
              - **Qualité** : unicité (magasin, jour) ; CA ≥ 0 ; tous les magasins ouverts présents ; écart < 0,5 % avec la comptabilité mensuelle.
              - **Données personnelles** : aucune (agrégat par magasin).
              - **Conservation** : 10 ans.
              - **Questions** : quel magasin progresse le plus ? quel est l'effet des soldes ? quels jours faut-il renforcer les équipes ?
      - id: de-projet
        title: Projet de bout en bout
        objectives:
          - Assembler toutes les briques dans un projet de portfolio
          - Avancer par versions qui fonctionnent
          - Présenter et défendre ses choix techniques
        docs:
          - { title: "data.gouv.fr — jeux de données ouverts", url: "https://www.data.gouv.fr/fr/datasets/" }
          - { title: "DataTalksClub — Data Engineering Zoomcamp (gratuit)", url: "https://github.com/DataTalksClub/data-engineering-zoomcamp" }
        quiz:
          - type: vf
            q: Mieux vaut un petit pipeline complet et fonctionnel qu'un grand pipeline à moitié fini.
            answer: true
            explain: Chaque version doit fonctionner de bout en bout.
          - type: qcm
            q: Qu'est-ce qu'un recruteur regarde en premier dans un projet ?
            choices: ["Le nombre de commits", "Le README : problème, architecture, choix, lancement", "La couleur du logo", "Le nombre de technologies"]
            answer: 1
            explain: Le README est la vitrine ; les choix justifiés montrent votre raisonnement.
        flashcards:
          - { q: "Les 6 versions du projet", a: "Script → fonctions/tests/Docker → étoile/dbt → orchestration → tableau de bord/README → cloud/Terraform." }
        exercises:
          - id: ex-projet-final
            type: projet
            title: Concevoir votre projet de portfolio
            statement: |
              Choisissez un jeu de données ouvert réel qui vous intéresse et concevez votre projet de bout en bout :
              1. la question métier à laquelle il répond ;
              2. la source et sa fréquence de mise à jour ;
              3. l'architecture (ingestion, bronze/silver/gold, modèle en étoile avec son grain) ;
              4. les outils choisis pour chaque étape, et pourquoi ;
              5. comment vous garantissez l'idempotence et la qualité ;
              6. le plan en versions successives.
            rubric:
              - Question métier claire et données réelles identifiées
              - Architecture complète et cohérente
              - Grain de la table de faits défini
              - Choix d'outils justifiés et proportionnés au volume
              - Idempotence et tests de qualité explicités
              - Plan par versions réaliste
            model: |
              **Exemple** — « Où et quand les carburants sont-ils les moins chers près de chez moi ? »
              - **Source** : prix des carburants en France (data.gouv.fr), mis à jour en continu ; extraction quotidienne.
              - **Architecture** : script Python (ingestion) → bronze (fichier brut daté) → silver (Parquet typé, dédoublonné, partitionné par jour) → DuckDB → dbt (faits `fct_prix` au grain station × carburant × relevé ; dimensions station, carburant, date) → tableau de bord Streamlit.
              - **Outils** : Python, DuckDB (volume de quelques Go : pas besoin de Spark), dbt (tests), Dagster ou Airflow (quotidien, 3 réessais), Docker Compose, GitHub Actions (lint + tests).
              - **Idempotence** : partition du jour réécrite à chaque exécution ; dbt reconstruit les tables gold.
              - **Qualité** : prix > 0 et < 5 €/L ; unicité station × carburant × date de relevé ; volume du jour > 80 % de la veille.
              - **Plan** : V0 script → V1 tests + Docker → V2 dbt → V3 orchestration → V4 tableau de bord + README → V5 Terraform sur un cloud.
