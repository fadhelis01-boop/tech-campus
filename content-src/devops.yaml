id: devops
version: 2026.10.1
title: DevOps, CI/CD et fiabilité
branch: Cloud & DevOps
icon: ♾️
color: "#16a34a"
order: 31
updatedAt: 2026-10-05
description: Culture DevOps et indicateurs DORA, intégration et déploiement continus avec GitHub Actions, stratégies de déploiement, GitOps, observabilité, SRE et gestion des incidents.
outlook: Livrer souvent et sûrement est devenu un avantage concurrentiel ; CI/CD, observabilité et ingénierie de plateforme sont au cœur des recrutements DevOps et SRE.
glossary:
  - { term: DevOps, en: DevOps, def: "Culture et pratiques qui rapprochent développement et exploitation pour livrer souvent et de façon fiable." }
  - { term: Intégration continue, en: Continuous Integration (CI), def: "Intégrer et tester automatiquement chaque changement, plusieurs fois par jour." }
  - { term: Livraison continue, en: Continuous Delivery, def: "Chaque version validée peut être déployée en production à tout moment." }
  - { term: Déploiement continu, en: Continuous Deployment, def: "Chaque version validée est déployée automatiquement en production." }
  - { term: Workflow, en: workflow, def: "Suite automatisée de tâches (GitHub Actions), décrite en YAML." }
  - { term: Indicateurs DORA, en: DORA metrics, def: "Fréquence de déploiement, délai de mise en production, taux d'échec des changements, temps de rétablissement." }
  - { term: Déploiement canari, en: canary deployment, def: "Exposer d'abord une petite part du trafic à la nouvelle version, puis augmenter si tout va bien." }
  - { term: Bleu/vert, en: blue/green deployment, def: "Deux environnements identiques ; on bascule le trafic de l'un à l'autre." }
  - { term: Feature flag, en: feature flag, def: "Interrupteur qui active une fonctionnalité sans redéployer." }
  - { term: GitOps, en: GitOps, def: "Git comme source de vérité de l'état voulu, appliqué par un agent (Argo CD, Flux)." }
  - { term: Observabilité, en: observability, def: "Capacité à comprendre l'état d'un système par ses métriques, journaux et traces." }
  - { term: SLO, en: Service Level Objective, def: "Objectif interne de niveau de service (ex. 99,5 % de requêtes réussies)." }
  - { term: Budget d'erreur, en: error budget, def: "Marge d'échec tolérée : 100 % − SLO." }
  - { term: Post-mortem, en: postmortem, def: "Analyse sans reproche d'un incident : chronologie, causes, actions." }
  - { term: Astreinte, en: on-call, def: "Disponibilité hors heures de bureau pour répondre aux incidents." }
modules:
  - id: m1
    title: Livrer en continu
    level: 2
    summary: Culture DevOps, intégration continue, déploiement continu, tests dans la chaîne.
    lessons:
      - id: devops-culture
        title: La culture DevOps et les indicateurs DORA
        objectives:
          - Définir DevOps comme culture et pratiques
          - Connaître le cadre CALMS
          - Utiliser les quatre indicateurs DORA
        docs:
          - { title: "DORA — Recherches et indicateurs", url: "https://dora.dev/" }
        quiz:
          - type: qcm
            q: Lequel n'est PAS un indicateur DORA ?
            choices: ["Fréquence de déploiement", "Nombre de lignes de code écrites", "Taux d'échec des changements", "Temps de rétablissement"]
            answer: 1
            explain: Le volume de code ne mesure pas la performance de livraison.
          - type: vf
            q: Selon les recherches DORA, livrer plus vite rend forcément le système moins stable.
            answer: false
            explain: Les meilleures équipes sont à la fois plus rapides et plus stables, grâce à de petits changements.
        flashcards:
          - { q: "CALMS", a: "Culture, Automatisation, Lean, Mesure, Partage (Share)." }
          - { q: "4 indicateurs DORA", a: "Fréquence de déploiement, délai de mise en production, taux d'échec, temps de rétablissement." }
        exercises:
          - id: ex-dora
            type: calcul
            title: Calculer ses indicateurs DORA
            statement: |
              Sur le mois écoulé (20 jours ouvrés), une équipe a fait 40 déploiements en production. 4 ont provoqué un incident, rétablis respectivement en 30, 50, 20 et 60 minutes. Répondez par un nombre.
            questions:
              - { q: "Fréquence : nombre de déploiements par jour ouvré ?", answer: 2, explain: "40 / 20 = 2 par jour." }
              - { q: "Taux d'échec des changements (en %) ?", answer: 10, unit: "%", explain: "4 / 40 = 10 %." }
              - { q: "Temps moyen de rétablissement (en minutes) ?", answer: 40, unit: min, explain: "(30 + 50 + 20 + 60) / 4 = 40 min." }
      - id: devops-ci
        title: L'intégration continue avec GitHub Actions
        objectives:
          - Expliquer le principe de l'intégration continue
          - Écrire un workflow GitHub Actions (déclencheurs, jobs, steps)
          - Gérer les secrets dans la CI
        docs:
          - { title: "GitHub Actions — Documentation", url: "https://docs.github.com/fr/actions" }
          - { title: "GitHub Actions — Syntaxe des workflows", url: "https://docs.github.com/fr/actions/reference/workflows-and-actions/workflow-syntax" }
          - { title: "GitHub — Sécuriser ses workflows (OIDC)", url: "https://docs.github.com/fr/actions/concepts/security/openid-connect" }
        quiz:
          - type: qcm
            q: Où se placent les fichiers de workflow GitHub Actions ?
            choices: [".github/workflows/", ".ci/", "workflows.yaml à la racine", "Dans le README"]
            answer: 0
            explain: Chaque fichier YAML de .github/workflows/ est un workflow.
          - type: qcm
            q: Comment utiliser un secret dans un workflow ?
            choices: ["L'écrire dans le YAML", "${{ secrets.NOM }}", "Dans un commentaire", "Dans le nom de la branche"]
            answer: 1
            explain: Les secrets sont stockés dans les réglages du dépôt et masqués dans les journaux.
          - type: qcm
            q: Que fait « uses » dans une étape ?
            choices: ["Exécute une commande shell", "Appelle une action réutilisable", "Définit un déclencheur", "Choisit le runner"]
            answer: 1
            explain: run exécute une commande ; uses appelle une action (checkout, setup-python…).
        flashcards:
          - { q: "Structure d'un workflow", a: "name, on (déclencheurs), jobs → runs-on, steps (uses / run)." }
          - { q: "OIDC dans la CI", a: "Droits temporaires auprès du cloud, sans secret stocké." }
        exercises:
          - id: ex-gha
            type: config
            title: Écrire un workflow d'intégration continue
            filename: .github/workflows/ci.yml
            syntax: yaml
            statement: |
              Écrivez un workflow GitHub Actions nommé `CI` qui :
              - se déclenche sur les **push vers main** et sur les **pull requests** ;
              - contient un job `tests` qui tourne sur `ubuntu-latest` ;
              - récupère le code (`actions/checkout`), installe Python **3.12** (`actions/setup-python` avec `python-version`) ;
              - installe les dépendances (`pip install -r requirements.txt`), lance `ruff check .` puis `pytest`.
            starter: |
              name: CI
              on: push
              jobs:
                tests:
                  steps:
                    - run: pytest
            solution: |
              name: CI

              on:
                push:
                  branches: [main]
                pull_request:

              jobs:
                tests:
                  runs-on: ubuntu-latest
                  steps:
                    - uses: actions/checkout@v5
                    - uses: actions/setup-python@v6
                      with:
                        python-version: "3.12"
                    - run: pip install -r requirements.txt
                    - run: ruff check .
                    - run: pytest
            checks:
              - { label: "Déclenché par les push sur main", path: "on.push.branches", contains: "main" }
              - { label: "Déclenché par les pull requests", regex: "^\\s*pull_request\\s*:", hint: "Sous on:, ajoutez « pull_request: »." }
              - { label: "Job tests sur ubuntu-latest", path: "jobs.tests.runs-on", equals: "ubuntu-latest" }
              - { label: "Récupère le code avec actions/checkout", path: "jobs.tests.steps[*].uses", contains: "actions/checkout@" }
              - { label: "Installe Python 3.12", path: "jobs.tests.steps[*].with.python-version", equals: "3.12" }
              - { label: "Installe les dépendances", path: "jobs.tests.steps[*].run", contains: "pip install -r requirements.txt" }
              - { label: "Lance ruff", path: "jobs.tests.steps[*].run", contains: "ruff check" }
              - { label: "Lance pytest", path: "jobs.tests.steps[*].run", contains: "pytest" }
            hints:
              - "on: peut contenir plusieurs déclencheurs : push (avec branches) et pull_request."
              - "Chaque étape commence par « - » : soit uses:, soit run:."
              - "\"3.12\" entre guillemets, sinon YAML lit le nombre 3.12 (et \"3.10\" deviendrait 3.1 !)."
            model: "Mettez toujours les versions entre guillemets en YAML : `python-version: 3.10` serait lu comme le nombre 3.1. Et fixez les versions des actions (`@v5`) pour une chaîne stable et sûre."
      - id: devops-cd
        title: Livraison et déploiement continus
        objectives:
          - Distinguer livraison et déploiement continus
          - Choisir une stratégie de déploiement (progressive, bleu/vert, canari)
          - Prévoir le retour arrière et utiliser les feature flags
        docs:
          - { title: "Martin Fowler — Continuous Delivery", url: "https://martinfowler.com/bliki/ContinuousDelivery.html" }
          - { title: "Martin Fowler — Blue Green Deployment", url: "https://martinfowler.com/bliki/BlueGreenDeployment.html" }
        quiz:
          - type: qcm
            q: Quelle stratégie expose d'abord la nouvelle version à 5 % du trafic ?
            choices: ["Recréation", "Bleu/vert", "Canari", "Rolling"]
            answer: 2
            explain: Le canari limite le risque et permet de mesurer en conditions réelles.
          - type: qcm
            q: Quel avantage principal offre le bleu/vert ?
            choices: ["Aucun coût supplémentaire", "Un retour arrière instantané par simple bascule", "Pas besoin de tests", "Moins de serveurs"]
            answer: 1
            explain: L'ancienne version reste prête à recevoir le trafic.
          - type: vf
            q: Entre la recette et la production, on reconstruit l'image Docker pour être sûr d'avoir la dernière version.
            answer: false
            explain: On promeut le même artefact versionné ; reconstruire peut introduire des différences.
        flashcards:
          - { q: "Livraison vs déploiement continus", a: "Prêt à déployer à tout moment / déployé automatiquement." }
          - { q: "Feature flag", a: "Déployer désactivé, activer ensuite sans redéployer." }
        exercises:
          - id: ex-pipeline-cd
            type: ordre
            title: Un pipeline de livraison complet
            statement: Remettez dans l'ordre les étapes d'un pipeline CI/CD.
            items:
              - Le développeur pousse sa branche et ouvre une pull request
              - La CI exécute lint et tests unitaires
              - Après revue, la pull request est fusionnée dans main
              - L'image Docker est construite une seule fois et étiquetée avec sa version
              - L'image est déployée en recette et testée automatiquement
              - La même image est déployée en production en canari (5 % du trafic)
              - Les indicateurs sont bons, le trafic passe progressivement à 100 %
            model: Un seul artefact, promu d'étape en étape, avec des points de contrôle automatiques et un déploiement progressif.
      - id: devops-tests
        title: Les tests et contrôles dans la chaîne
        objectives:
          - Appliquer la pyramide des tests
          - Connaître les contrôles automatiques (lint, SAST, dépendances, secrets, données)
          - Rendre une CI rapide, fiable et bloquante
        docs:
          - { title: "Martin Fowler — The Practical Test Pyramid", url: "https://martinfowler.com/articles/practical-test-pyramid.html" }
        quiz:
          - type: qcm
            q: Quel outil détecte des mots de passe commités par erreur ?
            choices: ["pytest", "gitleaks", "ruff", "Grafana"]
            answer: 1
            explain: Les détecteurs de secrets analysent le code et l'historique.
          - type: qcm
            q: Que faire d'un test qui échoue aléatoirement une fois sur dix ?
            choices: ["Le relancer jusqu'à ce qu'il passe", "Le corriger ou le mettre en quarantaine", "L'ignorer", "Supprimer la CI"]
            answer: 1
            explain: Un test instable détruit la confiance dans la CI.
        flashcards:
          - { q: "SAST / SCA", a: "Analyse du code source / analyse des dépendances vulnérables." }
          - { q: "Règles d'une CI utile", a: "Rapide, fiable, bloquante, vérifications rapides d'abord." }
        exercises:
          - id: ex-ci-ordre
            type: ordre
            title: Ordonner les contrôles d'une CI
            statement: Pour obtenir un retour le plus vite possible, dans quel ordre placer ces contrôles ?
            items:
              - Lint et formatage (quelques secondes)
              - Détection de secrets
              - Tests unitaires (une à deux minutes)
              - Analyse des dépendances vulnérables
              - Construction de l'image Docker et scan de l'image
              - Tests d'intégration avec une base de test (plusieurs minutes)
            model: Les contrôles rapides et fréquemment en échec d'abord ; les plus lents et coûteux ensuite.
  - id: m2
    title: Exploiter en production
    level: 3
    summary: GitOps, observabilité, SLO, gestion des incidents et SRE.
    lessons:
      - id: devops-gitops
        title: Le GitOps
        objectives:
          - Expliquer le principe du GitOps
          - Distinguer modèles push et pull
          - Organiser les environnements et la promotion de versions
        docs:
          - { title: "OpenGitOps — principes", url: "https://opengitops.dev/" }
          - { title: "Argo CD — documentation", url: "https://argo-cd.readthedocs.io/en/stable/" }
        quiz:
          - type: qcm
            q: Dans le GitOps, comment déploie-t-on une nouvelle version en production ?
            choices: ["En se connectant au cluster", "En fusionnant une pull request qui modifie l'état voulu dans Git", "Par courriel", "En redémarrant les serveurs"]
            answer: 1
            explain: L'agent applique automatiquement ce qui est dans Git.
          - type: vf
            q: En modèle pull, la CI n'a pas besoin des identifiants du cluster.
            answer: true
            explain: L'agent dans le cluster tire les changements du dépôt.
        flashcards:
          - { q: "Agents GitOps", a: "Argo CD, Flux." }
          - { q: "Retour arrière en GitOps", a: "Annuler (revert) le commit fautif." }
      - id: devops-observabilite
        title: Observabilité, SLO et alertes
        objectives:
          - Distinguer métriques, journaux et traces
          - Définir SLI, SLO, SLA et budget d'erreur
          - Concevoir des alertes actionnables
        docs:
          - { title: "Google SRE Book — Service Level Objectives", url: "https://sre.google/sre-book/service-level-objectives/" }
          - { title: "OpenTelemetry — documentation", url: "https://opentelemetry.io/docs/" }
          - { title: "Prometheus — Overview", url: "https://prometheus.io/docs/introduction/overview/" }
        quiz:
          - type: qcm
            q: Quel pilier suit le parcours d'une requête à travers plusieurs services ?
            choices: ["Les métriques", "Les journaux", "Les traces", "Les tableaux de bord"]
            answer: 2
            explain: Une trace montre le temps passé dans chaque service.
          - type: qcm
            q: Avec un SLO de 99,9 %, quel est le budget d'erreur ?
            choices: ["99,9 %", "0,1 %", "1 %", "0,01 %"]
            answer: 1
            explain: "100 % − 99,9 % = 0,1 %."
          - type: vf
            q: Il faut une alerte pour chaque serveur dont le CPU dépasse 70 %.
            answer: false
            explain: On alerte sur les symptômes vus par les utilisateurs ; une alerte doit être actionnable.
        flashcards:
          - { q: "Signaux d'or", a: "Latence, trafic, erreurs, saturation." }
          - { q: "SLI / SLO / SLA", a: "Mesure / objectif interne / engagement contractuel." }
        exercises:
          - id: ex-slo
            type: calcul
            title: Budget d'erreur
            statement: Un service reçoit 2 millions de requêtes par mois, avec un SLO de 99,5 % de requêtes réussies. Répondez par un nombre.
            questions:
              - { q: "Combien de requêtes en échec le budget d'erreur autorise-t-il sur le mois ?", answer: 10000, explain: "0,5 % × 2 000 000 = 10 000." }
              - { q: "6 000 échecs ont déjà eu lieu. Quel pourcentage du budget est consommé ?", answer: 60, unit: "%", explain: "6 000 / 10 000 = 60 %." }
              - { q: "En minutes sur 30 jours, à combien d'indisponibilité totale correspond un SLO de 99,9 % ?", answer: 43.2, tolerance: 0.05, unit: min, explain: "0,1 % × 30 × 24 × 60 = 43,2 minutes." }
          - id: ex-logs-structures
            type: code
            lang: python
            title: Calculer un SLI à partir de journaux structurés
            statement: |
              La variable `journaux` contient des lignes JSON (une par requête) : `{"chemin", "statut", "duree_ms"}`.

              Écrivez `sli(journaux, seuil_ms=300)` qui renvoie le **pourcentage** (arrondi à 2 décimales) de requêtes **bonnes** : statut inférieur à 500 **et** durée inférieure ou égale au seuil.
            setup: |
              journaux = [
                  '{"chemin": "/api/clients", "statut": 200, "duree_ms": 120}',
                  '{"chemin": "/api/clients", "statut": 200, "duree_ms": 450}',
                  '{"chemin": "/api/commandes", "statut": 500, "duree_ms": 80}',
                  '{"chemin": "/api/commandes", "statut": 201, "duree_ms": 210}',
                  '{"chemin": "/api/produits", "statut": 404, "duree_ms": 15}',
                  '{"chemin": "/api/produits", "statut": 200, "duree_ms": 300}',
                  '{"chemin": "/api/clients", "statut": 503, "duree_ms": 1000}',
                  '{"chemin": "/api/clients", "statut": 200, "duree_ms": 95}',
              ]
            starter: |
              import json

              def sli(journaux, seuil_ms=300):
                  bonnes = 0
                  # lire chaque ligne avec json.loads
                  return 0.0

              print(sli(journaux))
            solution: |
              import json

              def sli(journaux, seuil_ms=300):
                  if not journaux:
                      return 100.0
                  bonnes = 0
                  for ligne in journaux:
                      r = json.loads(ligne)
                      if r["statut"] < 500 and r["duree_ms"] <= seuil_ms:
                          bonnes += 1
                  return round(bonnes / len(journaux) * 100, 2)

              print(sli(journaux))
            tests:
              - { label: "SLI à 300 ms", code: "assert sli(journaux) == 62.5, sli(journaux)" }
              - { label: "SLI à 500 ms", code: "assert sli(journaux, 500) == 75.0, sli(journaux, 500)" }
            hints:
              - "Une erreur 404 est une erreur du client : elle ne compte pas contre le service (statut < 500)."
              - "Bonnes requêtes / total × 100, arrondi avec round(…, 2)."
            model: "Des journaux structurés (JSON) se calculent en quelques lignes : c'est pourquoi on les préfère aux phrases libres. Un SLO de 99,5 % serait ici largement manqué (62,5 %) : le budget d'erreur est épuisé, priorité à la fiabilité."
      - id: devops-sre
        title: SRE et gestion des incidents
        objectives:
          - Conduire un incident (rétablir d'abord, communiquer)
          - Rédiger un post-mortem sans reproche
          - Réduire le labeur et préparer les astreintes
        docs:
          - { title: "Google SRE Book — Postmortem Culture", url: "https://sre.google/sre-book/postmortem-culture/" }
          - { title: "Google SRE Book — Eliminating Toil", url: "https://sre.google/sre-book/eliminating-toil/" }
        quiz:
          - type: qcm
            q: Pendant un incident, quelle est la priorité ?
            choices: ["Trouver le coupable", "Rétablir le service", "Écrire le post-mortem", "Comprendre la cause exacte avant d'agir"]
            answer: 1
            explain: On atténue d'abord (retour arrière, bascule), on analyse ensuite.
          - type: qcm
            q: Que signifie un post-mortem « sans reproche » ?
            choices: ["On n'écrit rien", "On cherche les failles du système plutôt qu'un coupable", "On ne parle pas de l'incident", "Personne n'est responsable des actions"]
            answer: 1
            explain: Les actions ont bien un responsable, mais on ne blâme pas les personnes pour l'erreur.
        flashcards:
          - { q: "Runbook", a: "Procédure écrite décrivant quoi faire pour une alerte donnée." }
          - { q: "Labeur (toil)", a: "Travail manuel, répétitif, automatisable, sans valeur durable." }
        exercises:
          - id: ex-postmortem
            type: projet
            title: Rédiger un post-mortem
            statement: |
              Mardi, de 14 h 05 à 14 h 52, l'API de commande a renvoyé des erreurs 500 pour 40 % des requêtes. À 14 h 00, une nouvelle version avait été déployée en une fois sur tous les serveurs. Elle utilisait une nouvelle colonne de la base, ajoutée par une migration… qui n'avait été appliquée qu'en recette. L'alerte s'est déclenchée à 14 h 15 ; l'ingénieur d'astreinte a cherché la cause jusqu'à 14 h 45, puis a fait un retour arrière.

              Rédigez le post-mortem : résumé et impact, chronologie, causes (déclenchante et profondes), ce qui a bien ou mal fonctionné, et au moins quatre actions concrètes.
            rubric:
              - Impact chiffré (durée, proportion d'erreurs)
              - Chronologie claire
              - Cause déclenchante (migration absente en production) et causes profondes (pas de vérification automatique, déploiement non progressif, alerte tardive)
              - Ton sans reproche
              - Actions concrètes, avec responsable et échéance (migration dans le pipeline, déploiement canari, retour arrière plus rapide, alerte sur le taux d'erreur)
            model: |
              **Résumé** : 47 minutes d'erreurs 500 sur 40 % des requêtes de l'API de commande.

              **Chronologie** : 14 h 00 déploiement · 14 h 05 premières erreurs · 14 h 15 alerte · 14 h 15-14 h 45 diagnostic · 14 h 45 retour arrière · 14 h 52 rétablissement.

              **Cause déclenchante** : le code utilisait une colonne absente en production (migration non appliquée).
              **Causes profondes** : migrations appliquées à la main et séparément du code ; déploiement en une fois sur 100 % des serveurs ; alerte déclenchée 10 minutes après le début ; retour arrière tenté trop tard (diagnostic d'abord).

              **Actions** :
              1. Intégrer les migrations au pipeline, appliquées avant le déploiement et rétrocompatibles (équipe plateforme, 2 semaines).
              2. Déploiement canari avec arrêt automatique si le taux d'erreur dépasse 2 % (équipe plateforme, 1 mois).
              3. Alerte sur le taux d'erreur à 5 minutes au lieu de 10 (SRE, 1 semaine).
              4. Runbook : en cas d'erreurs après un déploiement, retour arrière immédiat, diagnostic ensuite (SRE, 1 semaine).
