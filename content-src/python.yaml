        exercises:
          - id: ex-csv-json
            type: code
            lang: python
            title: Du CSV au JSON
            statement: |
              Le fichier `ventes.csv` (créé par le code de préparation) contient `produit,quantite,prix_unitaire`.

              Écrivez `convertir(chemin_csv, chemin_json)` qui :
              1. lit le CSV avec `csv.DictReader` ;
              2. calcule pour chaque ligne `total = quantite × prix_unitaire` (attention aux types !) ;
              3. écrit dans `chemin_json` une liste de dictionnaires `{"produit", "total"}` ;
              4. renvoie le **nombre de lignes** écrites.
            setup: |
              with open("ventes.csv", "w", encoding="utf-8") as f:
                  f.write("produit,quantite,prix_unitaire\nclavier,2,89.9\nsouris,5,29.9\n\"écran, 27 pouces\",1,249\n")
            starter: |
              import csv
              import json

              def convertir(chemin_csv, chemin_json):
                  lignes = []
                  # lire le CSV et remplir lignes
                  with open(chemin_json, "w", encoding="utf-8") as f:
                      json.dump(lignes, f, ensure_ascii=False)
                  return len(lignes)

              print(convertir("ventes.csv", "ventes.json"))
              print(open("ventes.json", encoding="utf-8").read())
            solution: |
              import csv
              import json

              def convertir(chemin_csv, chemin_json):
                  lignes = []
                  with open(chemin_csv, encoding="utf-8") as f:
                      for ligne in csv.DictReader(f):
                          total = int(ligne["quantite"]) * float(ligne["prix_unitaire"])
                          lignes.append({"produit": ligne["produit"], "total": round(total, 2)})
                  with open(chemin_json, "w", encoding="utf-8") as f:
                      json.dump(lignes, f, ensure_ascii=False)
                  return len(lignes)

              print(convertir("ventes.csv", "ventes.json"))
              print(open("ventes.json", encoding="utf-8").read())
            tests:
              - { label: "3 lignes converties", code: "assert convertir('ventes.csv', 'out.json') == 3" }
              - { label: "Totaux corrects, virgule dans le nom gérée", code: "import json; d = json.load(open('out.json', encoding='utf-8')); assert d == [{'produit': 'clavier', 'total': 179.8}, {'produit': 'souris', 'total': 149.5}, {'produit': 'écran, 27 pouces', 'total': 249.0}], d" }
            hints:
              - "csv.DictReader(f) donne des dictionnaires dont toutes les valeurs sont du texte."
              - "Convertissez : int(ligne[\"quantite\"]) et float(ligne[\"prix_unitaire\"])."
              - "Arrondissez le total à 2 décimales avec round()."
            model: "Le produit « écran, 27 pouces » contient une virgule : un `split(\",\")` naïf aurait décalé toutes les colonnes. Le module `csv` gère les guillemets. Et tout ce qui sort d'un CSV est du texte : on convertit avant de calculer."
