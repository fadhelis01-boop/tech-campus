        quiz:
          - type: qcm
            q: Que désigne self dans une méthode ?
            choices: ["La classe", "L'objet sur lequel la méthode est appelée", "Le module", "Le parent"]
            answer: 1
            explain: self est l'instance courante.
          - type: qcm
            q: Quelle méthode est appelée à la création d'un objet ?
            choices: ["__repr__", "__init__", "__main__", "__new_object__"]
            answer: 1
            explain: __init__ est le constructeur.
          - type: vf
            q: Il faut toujours préférer une classe à une fonction.
            answer: false
            explain: Une fonction simple est souvent plus lisible ; la classe se justifie quand données et comportements vont ensemble.
        flashcards:
          - { q: "Classe / objet", a: "Classe = modèle ; objet = exemplaire créé à partir du modèle." }
          - { q: "@dataclass", a: "Génère automatiquement constructeur et affichage pour un enregistrement." }
        exercises:
          - id: ex-stock
            type: code
            lang: python
            title: Une classe Stock
            statement: |
              Écrivez une classe `Stock` :
              - `Stock(produit, quantite=0)` ;
              - `entrer(n)` ajoute `n` ;
              - `sortir(n)` retire `n`, mais **lève une `ValueError`** si le stock est insuffisant ou si `n` n'est pas positif ;
              - `est_en_rupture()` renvoie `True` si la quantité est 0.
            starter: |
              class Stock:
                  def __init__(self, produit, quantite=0):
                      self.produit = produit
                      self.quantite = quantite

                  # méthodes à écrire

              s = Stock("clavier", 5)
              print(s.quantite)
            solution: |
              class Stock:
                  def __init__(self, produit, quantite=0):
                      self.produit = produit
                      self.quantite = quantite

                  def entrer(self, n):
                      if n <= 0:
                          raise ValueError("La quantité doit être positive")
                      self.quantite += n

                  def sortir(self, n):
                      if n <= 0:
                          raise ValueError("La quantité doit être positive")
                      if n > self.quantite:
                          raise ValueError("Stock insuffisant")
                      self.quantite -= n

                  def est_en_rupture(self):
                      return self.quantite == 0

              s = Stock("clavier", 5)
              print(s.quantite)
            tests:
              - { label: "Entrées et sorties", code: "s = Stock('souris', 2); s.entrer(3); s.sortir(4); assert s.quantite == 1" }
              - { label: "Rupture", code: "s = Stock('x', 1); s.sortir(1); assert s.est_en_rupture() is True" }
              - { label: "Sortie impossible → ValueError, stock inchangé", code: "s = Stock('x', 1)\ntry:\n    s.sortir(5)\n    assert False, 'ValueError attendue'\nexcept ValueError:\n    pass\nassert s.quantite == 1" }
              - { label: "Quantité négative refusée", code: "s = Stock('x', 1)\ntry:\n    s.sortir(-2)\n    assert False, 'ValueError attendue'\nexcept ValueError:\n    pass" }
            hints:
              - "Chaque méthode reçoit self en premier paramètre."
              - "Vérifiez les erreurs AVANT de modifier self.quantite."
            model: "La classe protège sa propre cohérence : impossible d'avoir un stock négatif. C'est l'un des intérêts de la POO : les règles vivent avec les données."
