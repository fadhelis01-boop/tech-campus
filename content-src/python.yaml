            title: Écrire les tests d'une fonction
            statement: |
              La fonction `remise(prix, client)` (fournie) applique une remise : 10 % pour les clients `"fidele"`, 20 % pour les `"vip"`, 0 sinon ; elle refuse les prix négatifs.

              Écrivez une fonction `tester_remise()` qui contient **au moins 4 assertions** couvrant : le client standard, le fidèle, le VIP et le prix négatif (qui doit lever une `ValueError`).

              L'application vérifiera que vos tests passent sur la bonne fonction… **et qu'ils détectent une version boguée.**
            setup: |
              def _remise_correcte(prix, client):
                  if prix < 0:
                      raise ValueError("prix négatif")
                  taux = {"fidele": 0.10, "vip": 0.20}.get(client, 0)
                  return round(prix * (1 - taux), 2)
              remise = _remise_correcte
            starter: |
              def tester_remise():
                  assert remise(100, "standard") == 100
                  # ajoutez vos assertions

              tester_remise()
              print("Tests passés")
            solution: |
              def tester_remise():
                  assert remise(100, "standard") == 100
                  assert remise(100, "fidele") == 90
                  assert remise(100, "vip") == 80
                  try:
                      remise(-1, "vip")
                      assert False, "une ValueError était attendue"
                  except ValueError:
                      pass

              tester_remise()
              print("Tests passés")
            tests:
              - { label: "Vos tests passent sur la bonne fonction", code: "remise = _remise_correcte\ntester_remise()" }
              - { label: "Ils détectent une remise VIP erronée", code: "def remise(p, c):\n    return round(p * (1 - {'fidele': 0.1, 'vip': 0.25}.get(c, 0)), 2) if p >= 0 else (_ for _ in ()).throw(ValueError())\nglobals()['remise'] = remise\ntry:\n    tester_remise()\n    raise AssertionError('vos tests ne détectent pas une remise VIP de 25 %')\nexcept AssertionError as e:\n    if 'ne détectent pas' in str(e):\n        raise\nfinally:\n    globals()['remise'] = _remise_correcte" }
              - { label: "Ils détectent l'oubli du contrôle des prix négatifs", code: "def remise(p, c):\n    return round(p * (1 - {'fidele': 0.1, 'vip': 0.2}.get(c, 0)), 2)\nglobals()['remise'] = remise\ntry:\n    tester_remise()\n    raise AssertionError('vos tests ne détectent pas l oubli du contrôle des prix négatifs')\nexcept AssertionError as e:\n    if 'ne détectent pas' in str(e):\n        raise\nfinally:\n    globals()['remise'] = _remise_correcte" }
            hints:
              - "Une assertion par catégorie de client."
              - "Pour l'erreur : try: remise(-1, ...) puis assert False ; except ValueError: pass"
            model: "Un bon test **échoue** quand le code est faux. C'est exactement ce que vérifie cet exercice : on remplace la fonction par des versions boguées et on regarde si vos tests les attrapent (c'est le principe des « tests de mutation »)."
      - id: py-api
        title: Interroger une API web
        objectives:
          - Construire une requête HTTP avec requests (paramètres, en-têtes, timeout)
          - Parcourir une API paginée
          - Gérer limites et erreurs (429, 5xx) avec des réessais
        docs:
          - { title: "Requests — Quickstart", url: "https://requests.readthedocs.io/en/latest/user/quickstart/" }
          - { title: "FastAPI — Tutoriel", url: "https://fastapi.tiangolo.com/fr/tutorial/" }
        quiz:
          - type: qcm
            q: Pourquoi indiquer un timeout dans requests.get ?
            choices: ["Pour aller plus vite", "Pour ne pas bloquer indéfiniment si le serveur ne répond pas", "C'est obligatoire", "Pour chiffrer la requête"]
            answer: 1
            explain: Sans timeout, un appel peut rester suspendu pour toujours.
          - type: qcm
            q: Une API répond 429. Que faire ?
            choices: ["Réessayer immédiatement en boucle", "Ralentir et réessayer après un délai", "Changer de jeton", "Abandonner définitivement"]
            answer: 1
            explain: 429 = trop de requêtes ; l'en-tête Retry-After indique souvent combien attendre.
          - type: vf
            q: On peut écrire le jeton d'accès d'une API directement dans le code commité.
            answer: false
            explain: Le jeton se lit dans une variable d'environnement alimentée par un gestionnaire de secrets.
        flashcards:
          - { q: "raise_for_status()", a: "Lève une erreur si la réponse HTTP est un code 4xx ou 5xx." }
          - { q: "Backoff exponentiel", a: "Attendre 1 s, 2 s, 4 s… entre les tentatives en cas d'erreur temporaire." }
        exercises:
          - id: ex-pagination
            type: code
            lang: python
            title: Récupérer toutes les pages d'une API
            statement: |
              La fonction `appeler_page(numero)` (fournie) simule une API paginée. Elle renvoie un dictionnaire :

              ```text
              {"commandes": [...], "page_suivante": True ou False}
              ```

              Écrivez `toutes_les_commandes()` qui parcourt toutes les pages à partir de la page 1, et renvoie la liste complète des commandes. Elle doit aussi renvoyer **le nombre d'appels** effectués : `(commandes, nb_appels)`.
            setup: |
              _pages = {1: ([101, 102, 103], True), 2: ([104, 105, 106], True), 3: ([107], False)}
              _appels = []
              def appeler_page(numero):
                  _appels.append(numero)
                  if numero not in _pages:
                      raise ValueError(f"La page {numero} n'existe pas : il fallait s'arrêter avant !")
                  cmds, suivante = _pages[numero]
                  return {"commandes": [{"id": c} for c in cmds], "page_suivante": suivante}
            starter: |
              def toutes_les_commandes():
                  commandes = []
                  page = 1
                  nb_appels = 0
                  # boucle à écrire
                  return commandes, nb_appels

              cmds, n = toutes_les_commandes()
              print(len(cmds), "commandes en", n, "appels")
            solution: |
              def toutes_les_commandes():
                  commandes = []
                  page = 1
                  nb_appels = 0
                  while True:
                      donnees = appeler_page(page)
                      nb_appels += 1
                      commandes.extend(donnees["commandes"])
                      if not donnees["page_suivante"]:
                          break
                      page += 1
                  return commandes, nb_appels

              cmds, n = toutes_les_commandes()
              print(len(cmds), "commandes en", n, "appels")
            tests:
              - { label: "Les 7 commandes sont récupérées dans l'ordre", code: "cmds, n = toutes_les_commandes(); assert [c['id'] for c in cmds] == [101, 102, 103, 104, 105, 106, 107]" }
              - { label: "Exactement 3 appels (pas de page en trop)", code: "cmds, n = toutes_les_commandes(); assert n == 3, n" }
            hints:
              - "while True: … break quand page_suivante est faux."
              - "liste.extend(autre_liste) ajoute tous les éléments."
            model: "Selon les API, la pagination se fait par numéro de page, par décalage (*offset*) ou par curseur (un jeton renvoyé par l'API) ; le principe de la boucle reste le même. En production, on y ajoute timeout, réessais et journalisation."
