            type: code
            lang: python
            title: Analyser une ligne de journal
            statement: |
              Les journaux d'un serveur web ont ce format :

              ```text
              2026-10-05 08:12:30 GET /api/clients 200 35ms
              ```

              Écrivez `analyser(ligne)` qui renvoie un dictionnaire :
              `{"date": "2026-10-05", "methode": "GET", "chemin": "/api/clients", "statut": 200, "duree_ms": 35}`

              (`statut` et `duree_ms` sont des **entiers**.)
            starter: |
              def analyser(ligne):
                  morceaux = ligne.split()
                  # à compléter
                  return {}

              print(analyser("2026-10-05 08:12:30 GET /api/clients 200 35ms"))
            solution: |
              def analyser(ligne):
                  date, heure, methode, chemin, statut, duree = ligne.split()
                  return {
                      "date": date,
                      "methode": methode,
                      "chemin": chemin,
                      "statut": int(statut),
                      "duree_ms": int(duree.removesuffix("ms")),
                  }

              print(analyser("2026-10-05 08:12:30 GET /api/clients 200 35ms"))
            tests:
              - { label: "Ligne nominale", code: "assert analyser('2026-10-05 08:12:30 GET /api/clients 200 35ms') == {'date': '2026-10-05', 'methode': 'GET', 'chemin': '/api/clients', 'statut': 200, 'duree_ms': 35}" }
              - { label: "Autre ligne (POST, 500, 1204ms)", code: "r = analyser('2026-10-06 23:59:01 POST /api/commandes 500 1204ms'); assert r['statut'] == 500 and r['duree_ms'] == 1204 and r['methode'] == 'POST'" }
            hints:
