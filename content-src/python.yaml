id: python
version: 2026.10.1
title: Programmer en Python
branch: Socle
icon: 🐍
color: "#3776ab"
order: 13
updatedAt: 2026-10-05
description: Du premier print aux tests automatisés et aux API — le langage n° 1 de la data et de l'automatisation, pratiqué dans un vrai Python.
outlook: Python domine la data, l'IA et l'automatisation d'infrastructure ; c'est le langage le plus demandé dans les offres data engineer.
glossary:
  - { term: Variable, en: variable, def: "Nom qui désigne une valeur." }
  - { term: Chaîne de caractères, en: string (str), def: "Valeur texte, entre guillemets." }
  - { term: Liste, en: list, def: "Suite ordonnée et modifiable de valeurs, entre crochets." }
  - { term: Dictionnaire, en: dictionary (dict), def: "Association de clés et de valeurs, entre accolades." }
  - { term: Fonction, en: function, def: "Bloc de code nommé, réutilisable, qui reçoit des paramètres et renvoie un résultat." }
  - { term: Boucle, en: loop, def: "Répétition d'un bloc (for sur une séquence, while tant qu'une condition est vraie)." }
  - { term: Exception, en: exception, def: "Erreur levée pendant l'exécution, que l'on peut attraper avec try/except." }
  - { term: f-string, en: f-string, def: "Chaîne préfixée par f, dans laquelle les {variables} sont remplacées par leur valeur." }
  - { term: Module, en: module, def: "Fichier Python dont on peut importer les fonctions." }
  - { term: Paquet, en: package, def: "Bibliothèque installable avec pip depuis PyPI." }
  - { term: Environnement virtuel, en: virtual environment, def: "Dossier isolé contenant les dépendances d'un projet (python -m venv .venv)." }
  - { term: Classe, en: class, def: "Modèle qui regroupe données (attributs) et comportements (méthodes)." }
  - { term: Compréhension de liste, en: list comprehension, def: "Construction concise d'une liste : [x * 2 for x in valeurs if x > 0]." }
  - { term: Générateur, en: generator, def: "Fonction qui produit ses valeurs une à une avec yield, sans tout charger en mémoire." }
  - { term: Test unitaire, en: unit test, def: "Test automatisé d'une fonction isolée." }
  - { term: Pagination, en: pagination, def: "Découpage des résultats d'une API en pages successives." }
modules:
  - id: m1
    title: Les bases
    level: 1
    summary: Variables et types, conditions, boucles, listes et dictionnaires, fonctions.
    lessons:
      - id: py-premiers-pas
        title: Premiers pas — afficher, calculer, nommer
        objectives:
          - Utiliser print, les opérateurs et les variables
          - Connaître les types de base et convertir entre eux
          - Mettre en forme avec les f-strings
        docs:
          - { title: "Tutoriel Python officiel (français)", url: "https://docs.python.org/fr/3/tutorial/introduction.html" }
        quiz:
          - type: qcm
            q: Que vaut 7 // 2 en Python ?
            choices: ["3.5", "3", "4", "1"]
            answer: 1
            explain: "// est la division entière ; 7 % 2 donnerait le reste, 1."
          - type: qcm
            q: Que provoque "36" + 1 ?
            choices: ["37", "\"361\"", "Une TypeError", "36"]
            answer: 2
            explain: On ne peut pas additionner du texte et un nombre ; il faut convertir avec int("36").
          - type: qcm
            q: Quel nom de variable respecte les conventions Python ?
            choices: ["NbClients", "nb clients", "nb_clients", "2clients"]
            answer: 2
            explain: snake_case, sans espace, sans commencer par un chiffre.
          - type: qcm
            q: Que produit f"{3.14159:.2f}" ?
            choices: ["3.14159", "3.14", "3", "3.1"]
            answer: 1
            explain: ":.2f arrondit l'affichage à 2 décimales."
        flashcards:
          - { q: "Types de base", a: "int, float, str, bool, None." }
          - { q: "Convertir un texte en nombre", a: "int(\"36\"), float(\"12.5\")" }
          - { q: "f-string", a: "f\"Bonjour {nom}\" ; f\"{x:.2f}\" pour 2 décimales." }
        exercises:
          - id: ex-facture
            type: code
            lang: python
            title: Une première facture
            statement: |
              Complétez le programme pour qu'il calcule le **total TTC** d'une commande et l'affiche exactement ainsi :

              ```text
              Total TTC : 179.64 €
              ```

              - prix unitaire hors taxes : 49.90 €
              - quantité : 3
              - TVA : 20 %
            starter: |
              prix_ht = 49.90
              quantite = 3
              tva = 0.20

              total_ttc = 0  # à calculer

              print(f"Total TTC : {total_ttc} €")
            solution: |
              prix_ht = 49.90
              quantite = 3
              tva = 0.20

              total_ttc = prix_ht * quantite * (1 + tva)

              print(f"Total TTC : {total_ttc:.2f} €")
            tests:
              - { label: "La variable total_ttc vaut environ 179.64", code: "assert abs(total_ttc - 179.64) < 0.01, f'total_ttc vaut {total_ttc}'" }
              - { label: "L'affichage est exactement « Total TTC : 179.64 € »", stdout: "Total TTC : 179.64 €" }
            hints:
              - "Total HT = prix × quantité ; total TTC = total HT × (1 + tva)."
              - "Pour afficher 2 décimales : {total_ttc:.2f} dans la f-string."
            model: "`49.90 * 3 * 1.2` donne `179.64000000000001` à cause de la représentation des nombres à virgule en binaire : d'où l'importance de `:.2f` à l'affichage (et, pour de la vraie comptabilité, du module `decimal`)."
      - id: py-conditions
        title: Prendre des décisions — if, elif, else
        objectives:
          - Écrire des conditions avec if / elif / else
          - Combiner des conditions avec and, or, not
          - Tester l'absence de valeur avec is None
        docs:
          - { title: "Tutoriel Python — l'instruction if", url: "https://docs.python.org/fr/3/tutorial/controlflow.html#if-statements" }
        quiz:
          - type: qcm
            q: Quel opérateur teste l'égalité ?
            choices: ["=", "==", "===", ":="]
            answer: 1
            explain: "= affecte une valeur ; == compare."
          - type: qcm
            q: Laquelle de ces valeurs est considérée comme « fausse » dans un if ?
            choices: ["\"0\"", "[0]", "\"\"", "\"False\""]
            answer: 2
            explain: Le texte vide est faux ; "0" et "False" sont des textes non vides, donc vrais.
          - type: vf
            q: En Python, l'indentation sert seulement à rendre le code plus joli.
            answer: false
            explain: Elle définit les blocs ; une indentation incorrecte provoque une erreur ou un comportement différent.
        flashcards:
          - { q: "Tester l'absence de valeur", a: "if x is None:" }
          - { q: "Comparaisons enchaînées", a: "18 <= age < 65" }
        exercises:
          - id: ex-qualite
            type: code
            lang: python
            title: Règles de qualité des données
            statement: |
              Écrivez `controler(age)` qui renvoie :
              - `"manquant"` si `age` est `None` ;
              - `"invalide"` si `age` est négatif ou supérieur à 120 ;
              - `"mineur"` si `age` est inférieur à 18 ;
              - `"majeur"` sinon.
            starter: |
              def controler(age):
                  # à compléter
                  return "majeur"

              print(controler(None), controler(-3), controler(12), controler(40))
            solution: |
              def controler(age):
                  if age is None:
                      return "manquant"
                  if age < 0 or age > 120:
                      return "invalide"
                  if age < 18:
                      return "mineur"
                  return "majeur"

              print(controler(None), controler(-3), controler(12), controler(40))
            tests:
              - { label: "None → manquant", code: "assert controler(None) == 'manquant'" }
              - { label: "-3 et 150 → invalide", code: "assert controler(-3) == 'invalide' and controler(150) == 'invalide'" }
              - { label: "12 → mineur", code: "assert controler(12) == 'mineur'" }
              - { label: "18 et 40 → majeur", code: "assert controler(18) == 'majeur' and controler(40) == 'majeur'" }
            hints:
              - "Testez d'abord None : comparer None avec un nombre provoquerait une erreur."
              - "L'ordre des tests compte : du plus particulier au plus général."
            model: "L'ordre des conditions est essentiel : `None` d'abord (sinon `None < 0` plante), puis l'invalide, puis les catégories. Chaque `return` sort de la fonction, d'où l'absence de `elif` nécessaire."
      - id: py-boucles
        title: Répéter — for, range, while
        objectives:
          - Parcourir une séquence avec for
          - Accumuler un résultat dans une boucle
          - Utiliser while, break et continue sans boucle infinie
        docs:
          - { title: "Tutoriel Python — for et range", url: "https://docs.python.org/fr/3/tutorial/controlflow.html#for-statements" }
        quiz:
          - type: qcm
            q: Quelles valeurs produit range(2, 6) ?
            choices: ["2, 3, 4, 5, 6", "2, 3, 4, 5", "3, 4, 5, 6", "0 à 6"]
            answer: 1
            explain: La borne de fin est exclue.
          - type: qcm
            q: Que fait « continue » dans une boucle ?
            choices: ["Sort de la boucle", "Passe directement au tour suivant", "Recommence la boucle depuis le début", "Arrête le programme"]
            answer: 1
            explain: break sort de la boucle ; continue saute le reste du tour courant.
          - type: vf
            q: Une boucle while dont la condition ne change jamais peut tourner indéfiniment.
            answer: true
            explain: C'est la boucle infinie ; quelque chose doit faire évoluer la condition.
        flashcards:
          - { q: "enumerate", a: "Donne le numéro et l'élément : for i, x in enumerate(liste)." }
          - { q: "zip", a: "Parcourt plusieurs listes en parallèle." }
        exercises:
          - id: ex-stats
            type: code
            lang: python
            title: Statistiques d'une journée de ventes
            statement: |
              Écrivez `resume(montants)` qui renvoie un **tuple** `(total, nb_ventes, plus_grosse)` à partir d'une liste de montants.

              **Sans utiliser** `sum()` ni `max()` : l'objectif est de pratiquer la boucle et l'accumulation.
              Pour une liste vide, renvoyez `(0, 0, None)`.
            starter: |
              def resume(montants):
                  total = 0
                  nb = 0
                  plus_grosse = None
                  # une boucle for ici
                  return (total, nb, plus_grosse)

              print(resume([120, 80.5, 45, 300]))
            solution: |
              def resume(montants):
                  total = 0
                  nb = 0
                  plus_grosse = None
                  for m in montants:
                      total += m
                      nb += 1
                      if plus_grosse is None or m > plus_grosse:
                          plus_grosse = m
                  return (total, nb, plus_grosse)

              print(resume([120, 80.5, 45, 300]))
            tests:
              - { label: "Cas nominal", code: "assert resume([120, 80.5, 45, 300]) == (545.5, 4, 300)" }
              - { label: "Liste vide", code: "assert resume([]) == (0, 0, None)" }
              - { label: "Montants tous négatifs (le max est -1)", code: "assert resume([-5, -1, -9]) == (-15, 3, -1)" }
            hints:
              - "Initialisez plus_grosse à None, et remplacez-la si elle est None ou si m est plus grand."
              - "Le cas « tous négatifs » piège ceux qui initialisent plus_grosse à 0."
            model: "Initialiser le maximum à `None` (et non à 0) est le réflexe correct : avec 0, une liste de montants négatifs donnerait un maximum faux. C'est un excellent exemple de **cas limite**."
          - id: ex-retry
            type: code
            lang: python
            title: Réessayer jusqu'à trois fois
            statement: |
              La fonction `appeler_api()` (fournie) échoue parfois : elle renvoie `None` en cas d'échec, ou une donnée en cas de succès.

              Écrivez `appeler_avec_reessais(max_tentatives=3)` qui appelle `appeler_api()` **jusqu'à** `max_tentatives` fois, s'arrête dès qu'un appel réussit, et renvoie un tuple `(resultat, nombre_de_tentatives)`. Si tout échoue : `(None, max_tentatives)`.
            setup: |
              _reponses = []
              def preparer(reponses):
                  _reponses.clear()
                  _reponses.extend(reponses)
              def appeler_api():
                  return _reponses.pop(0) if _reponses else None
              preparer([None, None, {"ok": True}])
            starter: |
              def appeler_avec_reessais(max_tentatives=3):
                  tentative = 0
                  # une boucle while ici
                  return (None, tentative)

              print(appeler_avec_reessais())
            solution: |
              def appeler_avec_reessais(max_tentatives=3):
                  tentative = 0
                  while tentative < max_tentatives:
                      tentative += 1
                      resultat = appeler_api()
                      if resultat is not None:
                          return (resultat, tentative)
                  return (None, tentative)

              print(appeler_avec_reessais())
            tests:
              - { label: "Succès à la 3e tentative", code: "preparer([None, None, {'ok': True}]); assert appeler_avec_reessais() == ({'ok': True}, 3)" }
              - { label: "Succès immédiat", code: "preparer([{'ok': 1}]); assert appeler_avec_reessais() == ({'ok': 1}, 1)" }
              - { label: "Échec après 3 tentatives (et pas une de plus)", code: "preparer([None, None, None, {'trop': 'tard'}]); assert appeler_avec_reessais() == (None, 3)" }
              - { label: "max_tentatives est respecté", code: "preparer([None] * 10); assert appeler_avec_reessais(5) == (None, 5)" }
            hints:
              - "while tentative < max_tentatives:"
              - "Dès qu'un résultat n'est pas None, un return sort de la fonction (et donc de la boucle)."
            model: "Dans la vraie vie, on ajoute une **attente croissante** entre les tentatives (`time.sleep(2 ** tentative)`) et on journalise chaque échec. Des bibliothèques comme `tenacity` fournissent ce motif tout fait."
      - id: py-listes-dicts
        title: Listes et dictionnaires
        objectives:
          - Manipuler les listes (indices, tranches, méthodes)
          - Manipuler les dictionnaires (clés, get, items)
          - Regrouper des données (le motif group by)
        docs:
          - { title: "Tutoriel Python — Structures de données", url: "https://docs.python.org/fr/3/tutorial/datastructures.html" }
        quiz:
          - type: qcm
            q: Avec ventes = [10, 20, 30], que vaut ventes[-1] ?
            choices: ["10", "30", "Une erreur", "20"]
            answer: 1
            explain: Les indices négatifs partent de la fin.
          - type: qcm
            q: Comment lire une clé qui peut être absente sans provoquer d'erreur ?
            choices: ["d[\"cle\"]", "d.get(\"cle\")", "d.cle", "get(d, cle)"]
            answer: 1
            explain: get renvoie None (ou la valeur par défaut fournie) si la clé manque.
          - type: qcm
            q: Quelle structure supprime automatiquement les doublons ?
            choices: ["list", "tuple", "set", "dict"]
            answer: 2
            explain: Un ensemble (set) ne contient chaque valeur qu'une fois.
        flashcards:
          - { q: "Regrouper et sommer par clé", a: "d[k] = d.get(k, 0) + valeur" }
          - { q: "Parcourir un dictionnaire", a: "for cle, valeur in d.items():" }
        exercises:
          - id: ex-group-by
            type: code
            lang: python
            title: Chiffre d'affaires par ville
            statement: |
              La variable `commandes` (fournie) est une liste de dictionnaires `{"client", "ville", "montant"}`.

              Écrivez `ca_par_ville(commandes)` qui renvoie un dictionnaire `{ville: total des montants}`.
            setup: |
              commandes = [
                  {"client": "Ada", "ville": "Lyon", "montant": 120},
                  {"client": "Linus", "ville": "Paris", "montant": 80},
                  {"client": "Grace", "ville": "Lyon", "montant": 45},
                  {"client": "Ken", "ville": "Lille", "montant": 200},
                  {"client": "Ada", "ville": "Lyon", "montant": 60},
              ]
            starter: |
              def ca_par_ville(commandes):
                  totaux = {}
                  # à compléter
                  return totaux

              print(ca_par_ville(commandes))
            solution: |
              def ca_par_ville(commandes):
                  totaux = {}
                  for c in commandes:
                      totaux[c["ville"]] = totaux.get(c["ville"], 0) + c["montant"]
                  return totaux

              print(ca_par_ville(commandes))
            tests:
              - { label: "Totaux corrects", code: "assert ca_par_ville(commandes) == {'Lyon': 225, 'Paris': 80, 'Lille': 200}, ca_par_ville(commandes)" }
              - { label: "Liste vide → dictionnaire vide", code: "assert ca_par_ville([]) == {}" }
            hints:
              - "totaux.get(ville, 0) renvoie 0 la première fois qu'on rencontre la ville."
            model: "C'est un **GROUP BY** écrit à la main. En SQL : `SELECT ville, SUM(montant) FROM commandes GROUP BY ville`. Avec pandas : `df.groupby(\"ville\")[\"montant\"].sum()`. Comprendre la version manuelle permet de comprendre les deux autres."
          - id: ex-dedoublonner
            type: code
            lang: python
            title: Dédoublonner en gardant l'ordre
            statement: |
              Écrivez `uniques(valeurs)` qui renvoie la liste des valeurs **sans doublons**, dans l'ordre de leur **première apparition**, en ignorant la casse et les espaces autour (`" Lyon"`, `"lyon"` et `"LYON"` sont la même ville). Renvoyez les valeurs nettoyées en minuscules.
            starter: |
              def uniques(valeurs):
                  vues = set()
                  resultat = []
                  # à compléter
                  return resultat

              print(uniques([" Lyon", "Paris", "lyon", "LILLE", "paris "]))
            solution: |
              def uniques(valeurs):
                  vues = set()
                  resultat = []
                  for v in valeurs:
                      propre = v.strip().lower()
                      if propre not in vues:
                          vues.add(propre)
                          resultat.append(propre)
                  return resultat

              print(uniques([" Lyon", "Paris", "lyon", "LILLE", "paris "]))
            tests:
              - { label: "Ordre de première apparition, nettoyé", code: "assert uniques([' Lyon', 'Paris', 'lyon', 'LILLE', 'paris ']) == ['lyon', 'paris', 'lille']" }
              - { label: "Liste vide", code: "assert uniques([]) == []" }
            hints:
              - "Un set retient ce qu'on a déjà vu ; une liste conserve l'ordre."
            model: "`set(valeurs)` supprimerait les doublons mais perdrait l'ordre (et ne nettoierait pas la casse). Le couple « set des valeurs vues + liste résultat » est un motif classique. Variante concise : `list(dict.fromkeys(v.strip().lower() for v in valeurs))`."
      - id: py-fonctions
        title: Les fonctions
        objectives:
          - Définir des fonctions avec paramètres, valeurs par défaut et return
          - Distinguer return et print
          - Écrire des fonctions courtes, nommées et documentées
        docs:
          - { title: "Tutoriel Python — Définir des fonctions", url: "https://docs.python.org/fr/3/tutorial/controlflow.html#defining-functions" }
        quiz:
          - type: qcm
            q: Que renvoie une fonction sans instruction return ?
            choices: ["0", "Une erreur", "None", "Le dernier calcul"]
            answer: 2
            explain: Sans return explicite, une fonction renvoie None.
          - type: qcm
            q: Dans def remise(prix, taux=0.1), que vaut taux si on appelle remise(100) ?
            choices: ["0", "0.1", "None", "Une erreur"]
            answer: 1
            explain: Le paramètre prend sa valeur par défaut.
          - type: vf
            q: Une variable créée dans une fonction est accessible partout dans le programme.
            answer: false
            explain: Elle est locale à la fonction.
        flashcards:
          - { q: "return vs print", a: "return renvoie la valeur à l'appelant ; print l'affiche seulement." }
          - { q: "Docstring", a: "Chaîne en triples guillemets sous le def, qui documente la fonction." }
        exercises:
          - id: ex-normaliser-tel
            type: code
            lang: python
            title: Normaliser des numéros de téléphone
            statement: |
              Écrivez `normaliser_tel(numero)` qui transforme un numéro français dans un format unique `+33XXXXXXXXX` :
              - on retire espaces, points et tirets ;
              - `06 12 34 56 78` → `+33612345678` (on remplace le 0 initial par `+33`) ;
              - `+33 6 12 34 56 78` → `+33612345678` ;
              - si le résultat n'a pas exactement 9 chiffres après `+33`, renvoyez `None`.
            starter: |
              def normaliser_tel(numero):
                  """Renvoie le numéro au format +33XXXXXXXXX, ou None s'il est invalide."""
                  # à compléter
                  return None

              print(normaliser_tel("06 12 34 56 78"))
            solution: |
              def normaliser_tel(numero):
                  """Renvoie le numéro au format +33XXXXXXXXX, ou None s'il est invalide."""
                  n = numero.replace(" ", "").replace(".", "").replace("-", "")
                  if n.startswith("+33"):
                      corps = n[3:]
                  elif n.startswith("0"):
                      corps = n[1:]
                  else:
                      return None
                  if len(corps) != 9 or not corps.isdigit():
                      return None
                  return "+33" + corps

              print(normaliser_tel("06 12 34 56 78"))
            tests:
              - { label: "06 12 34 56 78", code: "assert normaliser_tel('06 12 34 56 78') == '+33612345678'" }
              - { label: "06.12.34.56.78 et 06-12-34-56-78", code: "assert normaliser_tel('06.12.34.56.78') == '+33612345678' and normaliser_tel('06-12-34-56-78') == '+33612345678'" }
              - { label: "+33 6 12 34 56 78", code: "assert normaliser_tel('+33 6 12 34 56 78') == '+33612345678'" }
              - { label: "Numéros invalides → None", code: "assert normaliser_tel('0612') is None and normaliser_tel('06 12 34 56 7X') is None" }
            hints:
              - "Enchaînez les .replace() pour retirer les séparateurs."
              - "Gérez deux cas de préfixe : « +33 » ou « 0 »."
              - "str.isdigit() vérifie que le texte ne contient que des chiffres."
            model: "Une fonction de normalisation doit être **stricte** : mieux vaut renvoyer `None` (et compter les rejets) que fabriquer un faux numéro. Ces fonctions sont idéales à tester : entrées et sorties simples, cas limites nombreux."
  - id: m2
    title: Python pour les données
    level: 2
    summary: Texte, fichiers CSV et JSON, gestion des erreurs, modules et environnements.
    lessons:
      - id: py-texte
        title: Manipuler du texte
        objectives:
          - Utiliser les méthodes de chaînes (strip, split, join, replace…)
          - Mettre en forme avec les f-strings
          - Découvrir les expressions régulières
        docs:
          - { title: "Python — Méthodes de str", url: "https://docs.python.org/fr/3/library/stdtypes.html#string-methods" }
          - { title: "Python — Module re", url: "https://docs.python.org/fr/3/library/re.html" }
        quiz:
          - type: qcm
            q: Que renvoie "a;b;c".split(";") ?
            choices: ["\"abc\"", "[\"a\", \"b\", \"c\"]", "(\"a\", \"b\", \"c\")", "3"]
            answer: 1
            explain: split découpe en liste selon le séparateur.
          - type: qcm
            q: Que fait "  Lyon ".strip() ?
            choices: ["Supprime le texte", "Retire les espaces au début et à la fin", "Met en majuscules", "Remplace les espaces par des tirets"]
            answer: 1
            explain: strip retire les espaces (et retours à la ligne) aux extrémités.
          - type: qcm
            q: En expression régulière, que signifie \d+ ?
            choices: ["Une lettre", "Un ou plusieurs chiffres", "Exactement un chiffre", "Un espace"]
            answer: 1
            explain: "\\d = un chiffre ; + = un ou plusieurs."
        flashcards:
