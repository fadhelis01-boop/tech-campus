        exercises:
          - id: ex-comprehensions
            type: code
            lang: python
            title: Réécrire en compréhensions
            statement: |
              Réécrivez les trois fonctions en **une seule ligne** chacune (un `return` avec une compréhension), sans changer leur comportement.
            starter: |
              def emails_valides(emails):
                  res = []
                  for e in emails:
                      if "@" in e:
                          res.append(e.lower())
                  return res

              def index_par_id(clients):
                  res = {}
                  for c in clients:
                      res[c["id"]] = c["nom"]
                  return res

              def villes_distinctes(clients):
                  res = set()
                  for c in clients:
                      res.add(c["ville"])
                  return res
            solution: |
              def emails_valides(emails):
                  return [e.lower() for e in emails if "@" in e]

              def index_par_id(clients):
                  return {c["id"]: c["nom"] for c in clients}

              def villes_distinctes(clients):
                  return {c["ville"] for c in clients}
            tests:
              - { label: "emails_valides", code: "assert emails_valides(['Ada@EX.com', 'pas-un-mail', 'g@h.io']) == ['ada@ex.com', 'g@h.io']" }
              - { label: "index_par_id", code: "assert index_par_id([{'id': 1, 'nom': 'Ada', 'ville': 'Lyon'}, {'id': 2, 'nom': 'Ken', 'ville': 'Lyon'}]) == {1: 'Ada', 2: 'Ken'}" }
              - { label: "villes_distinctes", code: "assert villes_distinctes([{'ville': 'Lyon'}, {'ville': 'Lyon'}, {'ville': 'Lille'}]) == {'Lyon', 'Lille'}" }
              - { label: "Chaque fonction tient en une ligne de corps", code: "for f in (emails_valides, index_par_id, villes_distinctes):\n    lignes = {l for _, _, l in f.__code__.co_lines() if l} - {f.__code__.co_firstlineno}\n    assert len(lignes) == 1, f'{f.__name__} : le corps occupe {len(lignes)} lignes'" }
            hints:
              - "Liste : [expression for e in emails if condition]"
              - "Dictionnaire : {clé: valeur for c in clients}"
              - "Ensemble : {expression for c in clients}"
            model: "Les trois formes de compréhension (liste, dictionnaire, ensemble) remplacent avantageusement les boucles d'accumulation simples. Pour une logique plus complexe, la boucle reste plus lisible."
