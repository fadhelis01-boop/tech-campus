        exercises:
          - id: ex-rejets
            type: code
            lang: python
            title: Trier les lignes valides et les rejets
            statement: |
              Écrivez `nettoyer(lignes, seuil_rejet=0.2)` qui reçoit des montants sous forme de texte (`"12,5"`, `"80"`, `"N/A"`, `""`…) :
              - convertit chaque montant en `float` (la virgule décimale doit être acceptée) ;
              - met de côté les lignes non convertibles ;
              - renvoie `(valides, rejets)` ;
              - **lève une `ValueError`** si la proportion de rejets dépasse `seuil_rejet`.
            starter: |
              def nettoyer(lignes, seuil_rejet=0.2):
                  valides, rejets = [], []
                  for l in lignes:
                      valides.append(float(l))
                  return valides, rejets

              print(nettoyer(["120", "80,5", "N/A", "45", "300"]))
            solution: |
              def nettoyer(lignes, seuil_rejet=0.2):
                  valides, rejets = [], []
                  for l in lignes:
                      try:
                          valides.append(float(l.replace(",", ".")))
                      except ValueError:
                          rejets.append(l)
                  if lignes and len(rejets) / len(lignes) > seuil_rejet:
                      raise ValueError(f"Trop de rejets : {len(rejets)} sur {len(lignes)}")
                  return valides, rejets

              print(nettoyer(["120", "80,5", "N/A", "45", "300"]))
            tests:
              - { label: "Virgule acceptée, N/A rejeté", code: "assert nettoyer(['120', '80,5', 'N/A', '45', '300']) == ([120.0, 80.5, 45.0, 300.0], ['N/A'])" }
              - { label: "Trop de rejets → ValueError", code: "try:\n    nettoyer(['x', 'y', '1'])\n    assert False, 'une ValueError était attendue'\nexcept ValueError:\n    pass" }
              - { label: "Liste vide → ([], [])", code: "assert nettoyer([]) == ([], [])" }
            hints:
              - "Remplacez la virgule par un point avant float()."
              - "try: … except ValueError: rejets.append(l)"
              - "Proportion de rejets = len(rejets) / len(lignes) (attention à la liste vide)."
            model: "Ce motif (isoler les lignes en erreur, compter, échouer au-delà d'un seuil) est utilisé dans tous les pipelines de qualité. Un pipeline qui « avale » silencieusement 30 % de lignes invalides est pire qu'un pipeline qui s'arrête et alerte."
