# Jeux de données réutilisables : un exercice y fait référence avec
#   setup: "@boutique"
# Ils sont aussi proposés dans le labo SQL libre.
boutique:
  title: Boutique en ligne
  description: Clients, produits, commandes et lignes de commande d'un petit site marchand.
  sql: |
    CREATE TABLE clients (
      id INTEGER PRIMARY KEY,
      nom TEXT NOT NULL,
      ville TEXT,
      inscription DATE
    );
    CREATE TABLE produits (
      id INTEGER PRIMARY KEY,
      nom TEXT NOT NULL,
      categorie TEXT,
      prix REAL
    );
    CREATE TABLE commandes (
      id INTEGER PRIMARY KEY,
      client_id INTEGER REFERENCES clients(id),
      date_commande DATE,
      statut TEXT
    );
    CREATE TABLE lignes (
      commande_id INTEGER REFERENCES commandes(id),
      produit_id INTEGER REFERENCES produits(id),
      quantite INTEGER
    );
