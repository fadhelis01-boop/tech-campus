entrepot:
  title: Entrepôt de données (schéma en étoile)
  description: Une table de faits des ventes et trois dimensions (date, produit, magasin).
  sql: |
    CREATE TABLE dim_date (
      date_id INTEGER PRIMARY KEY,
      jour DATE,
      mois INTEGER,
      trimestre INTEGER,
      annee INTEGER,
      jour_semaine TEXT
    );
    CREATE TABLE dim_produit (
      produit_id INTEGER PRIMARY KEY,
      nom TEXT,
      categorie TEXT,
      marque TEXT
    );
    CREATE TABLE dim_magasin (
      magasin_id INTEGER PRIMARY KEY,
      ville TEXT,
      region TEXT,
      surface_m2 INTEGER
    );
    CREATE TABLE fait_ventes (
      vente_id INTEGER PRIMARY KEY,
      date_id INTEGER REFERENCES dim_date(date_id),
      produit_id INTEGER REFERENCES dim_produit(produit_id),
      magasin_id INTEGER REFERENCES dim_magasin(magasin_id),
      quantite INTEGER,
      montant REAL
    );
