id: ia-data
version: 2026.10.1
title: IA et données
branch: Sécurité & IA
icon: 🤖
color: "#c026d3"
order: 40
updatedAt: 2026-10-05
description: Les bases du machine learning, la préparation des données, les LLM et le RAG, le MLOps, l'IA responsable et l'AI Act — vus depuis le rôle du data engineer.
outlook: L'IA générative multiplie les besoins en données fiables, en pipelines d'ingestion (RAG) et en mise en production (MLOps) — des compétences au croisement de la data et du cloud.
glossary:
  - { term: Apprentissage automatique, en: machine learning, def: "Technique où la machine apprend des exemples plutôt que de règles écrites à la main." }
  - { term: Apprentissage profond, en: deep learning, def: "Machine learning fondé sur des réseaux de neurones à nombreuses couches." }
  - { term: LLM, en: Large Language Model, def: "Grand modèle de langage, entraîné à prédire la suite d'un texte." }
  - { term: Variable explicative, en: feature, def: "Information décrivant un exemple, utilisée par le modèle pour prédire." }
  - { term: Étiquette, en: label, def: "La valeur à prédire dans l'apprentissage supervisé." }
  - { term: Surapprentissage, en: overfitting, def: "Le modèle apprend par cœur ses données d'entraînement et généralise mal." }
  - { term: Fuite de données, en: data leakage, def: "Variable qui contient indirectement l'information à prédire, faussant l'évaluation." }
  - { term: Précision et rappel, en: precision / recall, def: "Part des alertes justes / part des cas réels détectés." }
  - { term: RAG, en: Retrieval-Augmented Generation, def: "Faire répondre un LLM à partir de passages retrouvés dans des documents, en les citant." }
  - { term: Embedding, en: embedding, def: "Vecteur de nombres représentant le sens d'un texte." }
  - { term: Base vectorielle, en: vector database, def: "Base qui retrouve rapidement les vecteurs les plus proches (pgvector…)." }
  - { term: Hallucination, en: hallucination, def: "Réponse plausible mais fausse produite par un modèle." }
  - { term: MLOps, en: MLOps, def: "Pratiques de mise en production, de surveillance et de maintenance des modèles." }
  - { term: Dérive des données, en: data drift, def: "Les données de production s'éloignent de celles de l'entraînement." }
  - { term: AI Act, en: EU AI Act, def: "Règlement européen qui encadre l'IA selon le niveau de risque." }
modules:
  - id: m1
    title: Comprendre l'IA
    level: 2
    summary: Les familles d'IA, la préparation des données, l'évaluation des modèles.
    lessons:
      - id: ia-bases
        title: IA, machine learning et deep learning
        objectives:
          - Distinguer IA, machine learning, deep learning et IA générative
          - Connaître les familles d'apprentissage
          - Comprendre le rôle décisif des données
        docs:
          - { title: "scikit-learn — Tutoriel d'introduction", url: "https://scikit-learn.org/stable/tutorial/basic/tutorial.html" }
          - { title: "CNIL — Intelligence artificielle", url: "https://www.cnil.fr/fr/intelligence-artificielle" }
        quiz:
          - type: qcm
            q: Prédire le prix d'un appartement à partir d'exemples de ventes est un problème…
            choices: ["Non supervisé", "Supervisé (régression)", "Par renforcement", "D'IA générative"]
            answer: 1
            explain: On dispose d'exemples avec la bonne réponse (le prix).
          - type: qcm
            q: Segmenter des clients en groupes sans catégories prédéfinies relève de…
            choices: ["L'apprentissage supervisé", "L'apprentissage non supervisé (clustering)", "La régression", "Le RAG"]
            answer: 1
            explain: Il n'y a pas d'étiquette ; le modèle trouve une structure.
          - type: vf
            q: Un meilleur algorithme compense toujours des données de mauvaise qualité.
            answer: false
            explain: Garbage in, garbage out — les données restent le premier facteur de succès.
        flashcards:
          - { q: "IA ⊃ ML ⊃ deep learning", a: "Le machine learning apprend d'exemples ; le deep learning utilise des réseaux de neurones profonds." }
          - { q: "3 familles d'apprentissage", a: "Supervisé, non supervisé, par renforcement." }
      - id: ia-preparer
        title: Préparer les données et évaluer un modèle
        objectives:
          - Construire variables et étiquette
          - Séparer entraînement et test, éviter surapprentissage et fuites
          - Choisir les bonnes métriques d'évaluation
        docs:
          - { title: "scikit-learn — Cross-validation et séparation", url: "https://scikit-learn.org/stable/modules/cross_validation.html" }
          - { title: "scikit-learn — Precision, recall", url: "https://scikit-learn.org/stable/modules/model_evaluation.html#precision-recall-f-measure-metrics" }
        quiz:
          - type: qcm
            q: Un modèle obtient 99 % de bonnes réponses à l'entraînement et 60 % en test. Diagnostic ?
            choices: ["Tout va bien", "Surapprentissage", "Données trop simples", "Bug d'affichage"]
            answer: 1
            explain: Il a appris par cœur au lieu de généraliser.
          - type: qcm
            q: Avec 1 % de fraudes, pourquoi l'exactitude est-elle trompeuse ?
            choices: ["Elle est trop difficile à calculer", "Répondre toujours « pas de fraude » donne 99 % d'exactitude sans rien détecter", "Elle ne s'applique qu'à la régression", "Elle est toujours de 50 %"]
            answer: 1
            explain: On regarde précision et rappel sur les classes rares.
          - type: vf
            q: Pour prévoir des ventes, on peut mélanger au hasard les dates entre entraînement et test.
            answer: false
            explain: On entraîne sur le passé et on teste sur une période ultérieure.
        flashcards:
          - { q: "Précision / rappel", a: "Part des alertes justes / part des cas réels détectés." }
          - { q: "Fuite de données", a: "Une variable qui contient la réponse ou une info indisponible au moment de prédire." }
        exercises:
          - id: ex-metriques
            type: code
            lang: python
            title: Calculer précision et rappel
            statement: |
              Écrivez `evaluer(reels, predits)` qui reçoit deux listes de booléens (vrai = fraude) et renvoie un dictionnaire `{"exactitude", "precision", "rappel"}`, chaque valeur arrondie à 3 décimales.
              - exactitude = bonnes réponses / total ;
              - précision = vrais positifs / (vrais positifs + faux positifs) — 0 si le modèle ne prédit aucune fraude ;
              - rappel = vrais positifs / (vrais positifs + faux négatifs) — 0 s'il n'y a aucune fraude réelle.
            starter: |
              def evaluer(reels, predits):
                  vp = fp = fn = 0
                  # compter
                  return {"exactitude": 0, "precision": 0, "rappel": 0}

              print(evaluer([True, False, False, True], [True, True, False, False]))
            solution: |
              def evaluer(reels, predits):
                  vp = fp = fn = 0
                  bonnes = 0
                  for r, p in zip(reels, predits):
                      if r == p:
                          bonnes += 1
                      if r and p:
                          vp += 1
                      elif p and not r:
                          fp += 1
                      elif r and not p:
                          fn += 1
                  precision = vp / (vp + fp) if vp + fp else 0
                  rappel = vp / (vp + fn) if vp + fn else 0
                  return {"exactitude": round(bonnes / len(reels), 3), "precision": round(precision, 3), "rappel": round(rappel, 3)}

              print(evaluer([True, False, False, True], [True, True, False, False]))
            tests:
              - { label: "Exemple simple", code: "assert evaluer([True, False, False, True], [True, True, False, False]) == {'exactitude': 0.5, 'precision': 0.5, 'rappel': 0.5}" }
              - { label: "Le modèle « jamais de fraude » : 99 % d'exactitude, rappel nul", code: "reels = [True] + [False] * 99\nassert evaluer(reels, [False] * 100) == {'exactitude': 0.99, 'precision': 0, 'rappel': 0.0}" }
              - { label: "Modèle parfait", code: "assert evaluer([True, False], [True, False]) == {'exactitude': 1.0, 'precision': 1.0, 'rappel': 1.0}" }
            hints:
              - "Vrai positif : fraude réelle ET prédite ; faux positif : prédite mais pas réelle ; faux négatif : réelle mais pas prédite."
              - "Attention à la division par zéro : précision = 0 si aucune fraude n'est prédite."
            model: "Le deuxième test illustre le piège de l'exactitude : 99 % de bonnes réponses, et pourtant aucune fraude détectée (rappel nul). Sur des classes déséquilibrées, on regarde précision et rappel, et on arbitre selon le coût d'une fausse alerte et d'une fraude manquée."
          - id: ex-split
            type: code
            lang: python
            title: Une séparation temporelle sans fuite
            statement: |
              Les exemples (fournis) sont des dictionnaires `{"date", "achats_90j", "resilie"}`.

              Écrivez `separer(exemples, date_coupure)` qui renvoie `(entrainement, test)` : l'entraînement contient les exemples **strictement antérieurs** à `date_coupure`, le test ceux **à partir** de cette date. Les deux listes doivent être triées par date.
            setup: |
              exemples = [
                  {"date": "2026-03-01", "achats_90j": 4, "resilie": False},
                  {"date": "2026-01-15", "achats_90j": 1, "resilie": True},
                  {"date": "2026-06-10", "achats_90j": 0, "resilie": True},
                  {"date": "2026-05-01", "achats_90j": 7, "resilie": False},
                  {"date": "2026-02-20", "achats_90j": 3, "resilie": False},
              ]
            starter: |
              import random

              def separer(exemples, date_coupure):
                  melange = exemples[:]
                  random.shuffle(melange)
                  coupe = int(len(melange) * 0.8)
                  return melange[:coupe], melange[coupe:]

              print(separer(exemples, "2026-04-01"))
            solution: |
              def separer(exemples, date_coupure):
                  tries = sorted(exemples, key=lambda e: e["date"])
                  entrainement = [e for e in tries if e["date"] < date_coupure]
                  test = [e for e in tries if e["date"] >= date_coupure]
                  return entrainement, test

              print(separer(exemples, "2026-04-01"))
            tests:
              - { label: "Entraînement = passé, test = futur", code: "a, t = separer(exemples, '2026-04-01'); assert [e['date'] for e in a] == ['2026-01-15', '2026-02-20', '2026-03-01'] and [e['date'] for e in t] == ['2026-05-01', '2026-06-10']" }
              - { label: "Aucun exemple de test antérieur à un exemple d'entraînement", code: "a, t = separer(exemples, '2026-03-01'); assert max(e['date'] for e in a) < min(e['date'] for e in t)" }
            hints:
              - "Les dates au format AAAA-MM-JJ se comparent correctement comme du texte."
              - "sorted(exemples, key=lambda e: e[\"date\"])"
            model: "Le mélange aléatoire du code de départ laisse le modèle « voir le futur » pendant l'entraînement : les performances mesurées seraient trop optimistes. Pour des données temporelles, on coupe dans le temps, comme dans la vraie vie."
  - id: m2
    title: L'IA en production
    level: 3
    summary: LLM et RAG, MLOps et LLMOps, IA responsable et AI Act.
    lessons:
      - id: ia-llm-rag
        title: LLM, RAG et bases vectorielles
        objectives:
          - Comprendre les forces et limites d'un LLM
          - Expliquer l'architecture RAG
          - Construire le pipeline d'ingestion d'un RAG
        docs:
          - { title: "Anthropic — Documentation de l'API Claude", url: "https://docs.claude.com/" }
          - { title: "pgvector", url: "https://github.com/pgvector/pgvector" }
        quiz:
          - type: qcm
            q: Quel est le but principal du RAG ?
            choices: ["Entraîner un nouveau modèle", "Faire répondre un LLM à partir de documents retrouvés, en les citant", "Compresser les documents", "Traduire"]
            answer: 1
            explain: Le RAG ancre les réponses dans des sources, ce qui réduit les hallucinations.
          - type: qcm
            q: Que représente un embedding ?
            choices: ["Un mot de passe", "Un vecteur qui représente le sens d'un texte", "Un format d'image", "Un index SQL"]
            answer: 1
            explain: Des textes de sens proche ont des vecteurs proches.
          - type: vf
            q: Dans un RAG d'entreprise, il faut respecter les droits d'accès aux documents lors de la recherche.
            answer: true
            explain: Sinon, l'assistant divulgue des documents à des personnes non autorisées.
        flashcards:
          - { q: "Étapes d'ingestion RAG", a: "Collecter, extraire, découper, vectoriser, indexer, mettre à jour, respecter les droits." }
          - { q: "Similarité cosinus", a: "Mesure de proximité entre deux vecteurs (1 = même direction)." }
        exercises:
          - id: ex-rag
            type: code
            lang: python
            title: Le moteur de recherche d'un RAG
            statement: |
              Écrivez `rechercher(question_vec, passages, k=2, droits=None)` qui renvoie les **titres** des `k` passages les plus proches de la question (similarité cosinus décroissante).

              `passages` est une liste de dictionnaires `{"titre", "vecteur", "groupe"}`. Si `droits` est fourni (un ensemble de groupes), on ne garde **que** les passages dont le `groupe` y figure.
            setup: |
              passages = [
                  {"titre": "Politique de remboursement", "vecteur": [0.9, 0.1, 0.2], "groupe": "public"},
                  {"titre": "Horaires du support", "vecteur": [0.1, 0.9, 0.1], "groupe": "public"},
                  {"titre": "Procédure de remboursement interne", "vecteur": [0.85, 0.15, 0.3], "groupe": "finance"},
                  {"titre": "Délais de livraison", "vecteur": [0.4, 0.3, 0.9], "groupe": "public"},
              ]
            starter: |
              import math

              def cosinus(a, b):
                  produit = sum(x * y for x, y in zip(a, b))
                  return produit / (math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b)))

              def rechercher(question_vec, passages, k=2, droits=None):
                  return []

              print(rechercher([1, 0, 0.2], passages))
            solution: |
              import math

              def cosinus(a, b):
                  produit = sum(x * y for x, y in zip(a, b))
                  return produit / (math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b)))

              def rechercher(question_vec, passages, k=2, droits=None):
                  autorises = [p for p in passages if droits is None or p["groupe"] in droits]
                  classes = sorted(autorises, key=lambda p: cosinus(question_vec, p["vecteur"]), reverse=True)
                  return [p["titre"] for p in classes[:k]]

              print(rechercher([1, 0, 0.2], passages))
            tests:
              - { label: "Les 2 passages les plus proches", code: "assert rechercher([1, 0, 0.2], passages) == ['Politique de remboursement', 'Procédure de remboursement interne'], rechercher([1, 0, 0.2], passages)" }
              - { label: "Les droits d'accès sont respectés", code: "assert rechercher([1, 0, 0.2], passages, k=2, droits={'public'}) == ['Politique de remboursement', 'Délais de livraison']" }
              - { label: "k = 1", code: "assert rechercher([0, 1, 0], passages, k=1) == ['Horaires du support']" }
            hints:
              - "Filtrer d'abord par droits, puis trier par similarité décroissante."
              - "sorted(..., key=lambda p: cosinus(question_vec, p[\"vecteur\"]), reverse=True)"
            model: "Filtrer **avant** de classer garantit qu'un document confidentiel n'est jamais transmis au modèle pour un utilisateur non autorisé. Une base vectorielle fait la même chose à grande échelle, avec des index approchés pour aller vite sur des millions de vecteurs."
      - id: ia-mlops
        title: MLOps et LLMOps
        objectives:
          - Décrire le cycle de vie d'un modèle en production
          - Connaître les briques du MLOps
          - Surveiller la dérive et les spécificités des LLM
        docs:
          - { title: "MLflow — documentation", url: "https://mlflow.org/docs/latest/index.html" }
          - { title: "Google Cloud — MLOps : livraison continue pour le ML", url: "https://cloud.google.com/architecture/mlops-continuous-delivery-and-automation-pipelines-in-machine-learning" }
        quiz:
          - type: qcm
            q: Les clients changent de comportement après un événement majeur ; le modèle se dégrade. Comment l'appelle-t-on ?
            choices: ["Surapprentissage", "Dérive (des données ou conceptuelle)", "Fuite de données", "Biais de sélection"]
            answer: 1
            explain: Le monde change, le modèle non : il faut surveiller et réentraîner.
          - type: qcm
            q: À quoi sert un registre de modèles ?
            choices: ["À stocker les données brutes", "À savoir quel modèle est en production et revenir à une version précédente", "À entraîner plus vite", "À chiffrer"]
            answer: 1
            explain: Comme un registre d'images Docker, mais pour les modèles.
        flashcards:
          - { q: "Cycle de vie d'un modèle", a: "Données → entraînement → évaluation → registre → déploiement → surveillance → réentraînement." }
          - { q: "LLMOps", a: "Évaluation, prompts versionnés, coûts/latence, sécurité (injection de prompt), traçabilité." }
        exercises:
          - id: ex-mlops-ordre
            type: ordre
            title: Mettre un modèle en production
            statement: Remettez dans l'ordre le cycle de vie d'un modèle de détection de fraude.
            items:
              - Préparer un jeu de données d'entraînement versionné
              - Entraîner plusieurs variantes et suivre les expériences
              - Évaluer sur un jeu de test récent (précision, rappel)
              - Enregistrer le meilleur modèle dans le registre
              - Déployer en canari derrière une API de prédiction
              - Surveiller les performances et la dérive des données
              - Réentraîner quand la dérive dépasse un seuil
            model: Le cycle ne s'arrête jamais : un modèle en production se surveille et se réentraîne.
      - id: ia-responsable
        title: IA responsable et AI Act
        objectives:
          - Identifier les risques d'un système d'IA
          - Situer un système dans les niveaux de risque de l'AI Act
          - Appliquer les bonnes pratiques d'IA responsable
        docs:
          - { title: "Commission européenne — Cadre réglementaire de l'IA", url: "https://digital-strategy.ec.europa.eu/fr/policies/regulatory-framework-ai" }
          - { title: "CNIL — Les fiches pratiques IA", url: "https://www.cnil.fr/fr/les-fiches-pratiques-ia" }
        quiz:
          - type: qcm
            q: Un outil de tri automatique des candidatures relève de quel niveau de l'AI Act ?
            choices: ["Risque minimal", "Risque limité", "Haut risque", "Interdit"]
            answer: 2
            explain: L'emploi et le recrutement figurent parmi les domaines à haut risque.
          - type: qcm
            q: Quelle obligation vise un assistant conversationnel grand public ?
            choices: ["Aucune", "La transparence : informer l'utilisateur qu'il interagit avec une IA", "Une interdiction", "Un brevet"]
            answer: 1
            explain: Les systèmes à risque limité ont des obligations de transparence.
          - type: vf
            q: La notation sociale des citoyens est interdite par l'AI Act.
            answer: true
            explain: Elle fait partie des pratiques à risque inacceptable, interdites depuis février 2025.
        flashcards:
          - { q: "4 niveaux de l'AI Act", a: "Inacceptable (interdit), haut risque, risque limité (transparence), risque minimal." }
          - { q: "Bonnes pratiques d'IA responsable", a: "Documenter, mesurer les biais, humain dans la boucle, expliquer, protéger les données, tester, surveiller." }
        exercises:
          - id: ex-biais
            type: code
            lang: python
            title: Mesurer un écart de traitement
            statement: |
              Un modèle accepte ou refuse des demandes. Les décisions (fournies) sont des dictionnaires `{"groupe", "accepte"}`.

              Écrivez `taux_par_groupe(decisions)` qui renvoie `{groupe: taux d'acceptation}` (arrondi à 2 décimales), puis `ecart_max(decisions)` qui renvoie l'écart entre le plus haut et le plus bas taux (arrondi à 2 décimales). Un écart important doit déclencher une analyse.
            setup: |
              decisions = (
                  [{"groupe": "A", "accepte": True}] * 8 + [{"groupe": "A", "accepte": False}] * 2
                  + [{"groupe": "B", "accepte": True}] * 5 + [{"groupe": "B", "accepte": False}] * 5
              )
            starter: |
              def taux_par_groupe(decisions):
                  return {}

              def ecart_max(decisions):
                  return 0

              print(taux_par_groupe(decisions), ecart_max(decisions))
            solution: |
              def taux_par_groupe(decisions):
                  totaux, acceptes = {}, {}
                  for d in decisions:
                      g = d["groupe"]
                      totaux[g] = totaux.get(g, 0) + 1
                      acceptes[g] = acceptes.get(g, 0) + (1 if d["accepte"] else 0)
                  return {g: round(acceptes[g] / totaux[g], 2) for g in totaux}

              def ecart_max(decisions):
                  taux = taux_par_groupe(decisions).values()
                  return round(max(taux) - min(taux), 2) if taux else 0

              print(taux_par_groupe(decisions), ecart_max(decisions))
            tests:
              - { label: "Taux par groupe", code: "assert taux_par_groupe(decisions) == {'A': 0.8, 'B': 0.5}" }
              - { label: "Écart maximal", code: "assert ecart_max(decisions) == 0.3" }
            hints:
              - "Compter, par groupe, le nombre total de décisions et le nombre d'acceptations."
              - "Écart = max des taux − min des taux."
            model: "Un écart de 30 points entre groupes n'est pas forcément une discrimination (les dossiers peuvent différer réellement), mais il **doit** être expliqué. Pour un système à haut risque, l'AI Act exige précisément ce type d'analyse, documentée."
