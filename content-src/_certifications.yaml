# Certifications professionnelles réelles qui jalonnent les parcours.
# Tarifs : prix publics de l'éditeur, hors taxes, constatés en octobre 2026.
# Ils changent souvent (promotions, nouvelles versions) : l'application
# rappelle de vérifier la page officielle avant de s'inscrire.
# « validates » : domaines TechCampus qui préparent l'examen.
- id: linux-essentials
  name: LPI Linux Essentials
  vendor: Linux Professional Institute (LPI)
  level: Débutant
  url: https://www.lpi.org/our-certifications/linux-essentials-overview/
  price: "≈ 110 € (tarif réduit lors d'événements communautaires)"
  format: QCM surveillé en ligne ou en centre, 60 minutes
  validity: À vie
  validates: [linux, fondamentaux]
  why: Prouve que vous savez utiliser Linux et la ligne de commande. Premier badge idéal pour un débutant, reconnu dans le monde du logiciel libre. Une nouvelle version 2.0 arrive fin 2026.
  cv: Certification LPI Linux Essentials — utilisation de Linux et de la ligne de commande
- id: lfcs
  name: LFCS — Linux Foundation Certified System Administrator
  vendor: The Linux Foundation
  level: Intermédiaire
  url: https://training.linuxfoundation.org/certification/linux-foundation-certified-sysadmin-lfcs/
  price: "445 $ (promotions fréquentes, souvent -30 à -40 %)"
  format: Examen pratique en ligne sur une vraie machine, 2 heures
  validity: 2 ans
  validates: [linux, reseaux]
  why: Examen 100 % pratique — on administre de vraies machines. Très apprécié pour les postes d'administration, DevOps et SRE.
  cv: LFCS (The Linux Foundation) — administration système Linux, examen pratique
- id: pcep
  name: PCEP — Certified Entry-Level Python Programmer
  vendor: Python Institute
  level: Débutant
  url: https://pythoninstitute.org/pcep
  price: 59 $
  format: QCM en ligne surveillé, 45 minutes
  validity: À vie
  validates: [python]
  why: Le premier jalon officiel en Python, peu coûteux, qui valide les bases (variables, boucles, fonctions, listes).
  cv: PCEP (Python Institute) — programmation Python, niveau fondamental
- id: pcap
  name: PCAP — Certified Associate in Python Programming
  vendor: Python Institute
  level: Intermédiaire
