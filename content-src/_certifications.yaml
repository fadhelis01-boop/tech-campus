  validity: À vie
  validates: [python, algo]
  why: Valide un niveau solide (modules, exceptions, programmation orientée objet). Pertinent si vous n'avez pas de diplôme en informatique.
  cv: PCAP (Python Institute) — programmation Python, niveau associé
