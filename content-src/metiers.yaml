id: metiers
version: 2026.10.1
title: Métiers de demain
branch: Méthode & carrière
icon: 🚀
color: "#db2777"
order: 2
updatedAt: 2026-10-05
description: Les métiers de la data et du cloud, les tendances des vingt prochaines années, le marché français, comment choisir sa voie.
outlook: Données, cloud, sécurité et IA sont devenus l'infrastructure de toute l'économie. Comprendre le marché permet de viser juste et de le rester.
glossary:
  - { term: Data engineer, en: data engineer, def: "Conçoit et maintient les pipelines qui collectent, transforment et mettent à disposition les données." }
  - { term: Analytics engineer, en: analytics engineer, def: "Modélise et teste en SQL les données prêtes à l'analyse." }
  - { term: SRE, en: Site Reliability Engineer, def: "Ingénieur chargé de la fiabilité et de la performance des services en production." }
  - { term: Platform engineer, en: platform engineer, def: "Construit une plateforme interne qui simplifie le travail des équipes de développement." }
  - { term: FinOps, en: FinOps, def: "Discipline de pilotage et d'optimisation des coûts du cloud." }
  - { term: ESN, en: IT services company, def: "Entreprise de services du numérique, qui réalise des missions pour des clients." }
  - { term: BMO, en: labour needs survey, def: "Enquête annuelle Besoins en main-d'œuvre de France Travail sur les projets de recrutement." }
  - { term: AI Act, en: EU AI Act, def: "Règlement européen sur l'intelligence artificielle, appliqué progressivement (l'essentiel depuis août 2026)." }
  - { term: Data Act, en: EU Data Act, def: "Règlement européen sur l'accès et le partage des données, applicable depuis le 12 septembre 2025." }
  - { term: NIS2, en: NIS2 directive, def: "Directive européenne de cybersécurité des entités essentielles et importantes." }
  - { term: Daily stand-up, en: daily stand-up, def: "Point d'équipe quotidien très court : avancement, objectifs, blocages." }
modules:
  - id: m1
    title: Comprendre les métiers et le marché
    level: 1
    summary: Panorama des métiers, tendances de fond, chiffres du marché français, choix de sa voie.
    lessons:
      - id: met-panorama
        title: Panorama des métiers de la data et du cloud
        objectives:
          - Distinguer data engineer, analyst, scientist, ML engineer
          - Distinguer ingénieur cloud, DevOps, SRE, platform engineer, FinOps
          - Identifier le socle commun
        docs:
          - { title: "Onisep — Les métiers de l'informatique", url: "https://www.onisep.fr/decouvrir-les-metiers/des-metiers-par-secteur/numerique-et-informatique" }
          - { title: "roadmap.sh — Data engineer et DevOps (feuilles de route communautaires)", url: "https://roadmap.sh/" }
        quiz:
          - type: qcm
            q: Qui conçoit les pipelines qui amènent des données propres aux analystes ?
            choices: ["Le data analyst", "Le data engineer", "Le product owner", "Le FinOps"]
            answer: 1
            explain: Le data engineer construit les « canalisations » de données.
          - type: qcm
            q: Quel métier est centré sur la fiabilité des services en production ?
            choices: ["SRE", "Data analyst", "Data scientist", "Analytics engineer"]
            answer: 0
            explain: Le SRE (Site Reliability Engineer) mesure et améliore la fiabilité, souvent avec des astreintes.
          - type: vf
            q: Linux, Git, Python et SQL sont utiles à la fois en data et en cloud/DevOps.
            answer: true
            explain: C'est le socle commun des deux familles de métiers.
        flashcards:
          - { q: "Data engineer vs data analyst", a: "Engineer : construit les pipelines. Analyst : répond aux questions avec les données." }
          - { q: "DevOps vs SRE", a: "DevOps : automatise du code à la production. SRE : garantit la fiabilité en production." }
        exercises:
          - id: ex-offre
            type: projet
            title: Décortiquer une offre d'emploi
            statement: |
              Trouvez une offre d'emploi réelle de **data engineer** ou d'**ingénieur cloud/DevOps** junior (France Travail, Apec, LinkedIn…).

              Copiez-la, puis analysez-la :
              1. les missions principales (en trois puces) ;
              2. les outils et technologies demandés, classés en « socle » (Linux, Git, Python, SQL, cloud) et « spécifiques » ;
              3. ce qui est indispensable et ce qui est « un plus » ;
              4. les domaines de TechCampus qui y préparent ;
              5. ce qui vous manque aujourd'hui, et dans combien de temps vous pourriez postuler.
            rubric:
              - Missions résumées clairement
              - Technologies correctement classées
              - Distinction indispensable / souhaité
              - Correspondance avec les domaines du parcours
              - Plan d'action réaliste
            model: |
              Exemple d'analyse : missions = construire des pipelines d'ingestion, modéliser l'entrepôt, garantir la qualité. Socle = Python, SQL, Git, AWS. Spécifiques = Airflow, dbt, Snowflake. Indispensable : SQL, Python, Git ; un plus : Snowflake, Terraform. Domaines : Python, SQL, Git, Cloud, Data engineering. Manque : orchestration et dbt (≈ 3 mois). Une analyse de ce type sur 5 à 10 offres donne une image fidèle du marché local.
      - id: met-tendances
        title: Les tendances des vingt prochaines années
        objectives:
          - Identifier les tendances de fond (IA, temps réel, souveraineté, automatisation, FinOps, sécurité)
          - Situer les grandes réglementations européennes et leur calendrier
          - Distinguer outils éphémères et compétences durables
        docs:
          - { title: "Commission européenne — AI Act", url: "https://digital-strategy.ec.europa.eu/fr/policies/regulatory-framework-ai" }
          - { title: "Commission européenne — Data Act", url: "https://digital-strategy.ec.europa.eu/en/policies/data-act" }
          - { title: "CNIL — Le règlement sur les données (Data Act)", url: "https://www.cnil.fr/fr/reglement-donnees-data-act-nouveau-cadre-europeen-pour-partage-utilisation-donnees" }
          - { title: "ANSSI — Directive NIS 2", url: "https://cyber.gouv.fr/la-directive-nis-2" }
        quiz:
          - type: qcm
            q: Pourquoi l'essor de l'IA générative augmente-t-il le besoin de data engineers ?
            choices: ["Parce que l'IA écrit tout le code", "Parce qu'un modèle ne vaut que par la qualité des données qu'on lui fournit", "Parce que les modèles n'ont pas besoin d'infrastructure", "Ce n'est pas le cas"]
            answer: 1
            explain: Préparer, gouverner et servir les données, puis faire tourner les modèles, ce sont des tâches d'ingénierie.
          - type: qcm
            q: Depuis quand le Data Act européen est-il applicable ?
            choices: ["2018", "12 septembre 2025", "2030", "Il n'existe pas"]
            answer: 1
            explain: Le règlement sur les données s'applique depuis le 12 septembre 2025 (certaines obligations sur les objets connectés suivent en 2026).
          - type: qcm
            q: Quelle discipline pilote les coûts du cloud ?
            choices: ["DevSecOps", "FinOps", "GitOps", "MLOps"]
            answer: 1
            explain: FinOps rassemble finance et ingénierie pour maîtriser la facture cloud.
          - type: vf
            q: Les outils étudiés aujourd'hui seront tous encore utilisés à l'identique dans vingt ans.
            answer: false
            explain: Les outils évoluent ; les fondamentaux (données, systèmes, automatisation, sécurité, capacité d'apprendre) restent.
        flashcards:
          - { q: "Six tendances de fond", a: "IA et données, temps réel, souveraineté et réglementation, automatisation/plateformes, FinOps et sobriété, sécurité." }
          - { q: "AI Act — calendrier", a: "La plupart des dispositions s'appliquent depuis le 2 août 2026 ; certaines obligations « haut risque » en décembre 2027." }
      - id: met-marche
        title: Le marché de l'emploi en France
        objectives:
          - Lire les indicateurs de tension (enquête BMO)
          - Connaître les ordres de grandeur de salaires et leurs limites
          - Identifier les voies d'accès en reconversion
        docs:
          - { title: "France Travail — Enquête Besoins en main-d'œuvre", url: "https://statistiques.francetravail.org/bmo" }
          - { title: "Apec — Simulateur de salaire", url: "https://www.apec.fr/tous-nos-outils/simulateur-de-salaire.html" }
          - { title: "Transitions Pro — projet de transition professionnelle", url: "https://www.transitionspro.fr/" }
        quiz:
          - type: qcm
            q: D'après la BMO 2026, que manque-t-il surtout au marché du numérique ?
            choices: ["Des candidats en général", "Des profils opérationnels rapidement autonomes", "Des diplômes de doctorat", "Des ordinateurs"]
            answer: 1
            explain: Les difficultés tiennent surtout au niveau d'autonomie attendu ; d'où l'importance des projets concrets.
          - type: vf
            q: Les fourchettes de salaire publiées s'appliquent telles quelles à un premier poste en reconversion.
            answer: false
            explain: Elles concernent souvent des diplômés d'école ; le premier salaire en reconversion ou en alternance peut être inférieur, puis rattrape avec l'expérience.
          - type: qcm
            q: Laquelle de ces voies permet d'être formé et rémunéré en entreprise ?
            choices: ["L'alternance", "Le MOOC", "Le livre", "Le hackathon"]
            answer: 0
            explain: L'alternance combine formation et emploi.
        flashcards:
          - { q: "Sources fiables sur le marché", a: "France Travail (BMO), Apec (baromètres, simulateur), Dares." }
          - { q: "4 voies de reconversion", a: "Autoformation + certifications + projets ; bootcamp ; titre RNCP / alternance ; reconversion interne." }
      - id: met-choisir
        title: Data ou cloud/DevOps — choisir sa voie
        objectives:
          - Se représenter une journée type dans chaque métier
          - Choisir sa voie selon ses goûts et son parcours
        quiz:
          - type: qcm
            q: Lequel de ces éléments est plus typique du quotidien cloud/DevOps que data ?
            choices: ["Écrire des modèles dbt", "Les astreintes en cas de panne", "Discuter de la définition d'un client actif", "Documenter un jeu de données"]
            answer: 1
            explain: Les astreintes sont fréquentes côté infrastructure et fiabilité.
          - type: vf
            q: Choisir la data ferme définitivement la porte du cloud/DevOps.
            answer: false
            explain: Le socle est commun et beaucoup de professionnels passent d'une voie à l'autre (DataOps, plateforme data).
        flashcards:
          - { q: "Journée data engineer", a: "Corriger un pipeline, échanger avec les métiers, écrire du SQL/dbt, revue de code, documentation." }
          - { q: "Journée cloud/DevOps", a: "Alertes, infrastructure en code, environnements, optimisation des coûts, mises à jour, astreintes." }
        exercises:
          - id: ex-orientation
            type: ordre
            title: Le chemin d'une donnée jusqu'à la décision
            statement: Remettez dans l'ordre les étapes du cycle de vie d'une donnée, et repérez qui intervient (data engineer, analytics engineer, analyst).
            items:
              - Une vente est enregistrée dans l'application de caisse
              - Le pipeline d'ingestion copie les ventes dans le data lake (data engineer)
              - Les données sont nettoyées et modélisées dans l'entrepôt (analytics engineer)
              - Des tests de qualité vérifient l'absence de doublons et de valeurs aberrantes
              - Le tableau de bord des ventes se met à jour (data analyst)
              - La direction décide d'augmenter le stock d'un produit
            model: Production → ingestion → transformation → qualité → restitution → décision. Chaque métier de la data intervient à une étape.
